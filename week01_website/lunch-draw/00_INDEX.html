 build เปลี่ยนกลางทาง เก็บไว้เป็นคำแนะนำให้ test e2e รอ hydrate | – |\n\n---\n\n## 3. รายการบั๊กที่ยืนยันแล้ว (master list)\n\n### P1\n\n**EXP-01 · สองคนกดสุ่มพร้อมกันในห้องแล้วจอเห็นคนละร้าน** (F02-01, F02-03)\n- ทำซ้ำ: เปิดห้อง → A, B, C เข้าห้องคนละเบราว์เซอร์ → A กับ B กด \"สุ่มร้าน\" พร้อมกัน → รอแอนิเมชันจบ\n- คาด: ทุกจอแสดง `latestDraw` ของห้อง · ได้: จอใดจอหนึ่งค้างที่ draw ของตัวเอง (3/3 รอบ แม้ไม่หน่วงเน็ต) และไม่แก้ตัวเองจนกว่าจะมีคนสุ่มใหม่\n- สาเหตุ: `runDraw()` เรียก `reveal(json, odds)` ด้วย response ของตัวเองเสมอ (`lunch-app.tsx:338-339`) ทั้งที่ SSE อาจส่ง draw ที่ใหม่กว่ามาก่อนแล้ว ประกอบกับ `reveal()` (`:179-199`) ไม่ยกเลิก timer ของรอบก่อน การ์ดจึงจบที่ร้านที่ timer มาถึงทีหลัง และ server ไม่กันการสุ่มซ้อน\n- แก้: ในห้อง ให้แสดงผลเฉพาะ `latestDraw` ที่มาจาก SSE หรือ GET (ไม่ใช้ response ของ POST) และ `reveal` ต้อง clear timer เก่า · ทางเลือกเพิ่ม: server ปฏิเสธการสุ่มที่ห่างจากครั้งก่อนไม่ถึง N วินาที\n\n**EXP-02 · ลบร้านที่เพิ่มเองแล้วเพิ่มร้านใหม่ ร้านใหม่ได้เลขเดิมและรับข้อมูลของร้านเก่าไปทั้งหมด** (F03-01, F02-04, F04-03)\n- ทำซ้ำ: `POST /api/restaurants` ร้าน A (ได้ #238) → ให้คะแนนแมว, สุ่มได้ A, กด \"ไปกิน\", โหวต −1 ในห้อง → `DELETE /api/restaurants/238` → `POST` ร้าน B\n- คาด: B ได้เลขใหม่และไม่มีประวัติ · ได้: B ได้ #238 พร้อม `ratingAvg 1`, `lastEatenAt` (ตัวคูณ ×0.2), `restaurantScores {\"238\":-1}` และ `/history` แสดง \"ร้าน B\" แทน A ย้อนหลัง\n- สาเหตุ: `addRestaurant` ใช้ `max(number)+1` (`store.ts:188`) · `deleteRestaurant` (`:197-206`) ไม่ล้าง ratings / room votes · ประวัติเก็บแค่ `restaurantId` แล้วไปหาชื่อตอนแสดง (`history/page.tsx:38-41`)\n- แก้: เก็บตัวนับ `nextNumber` ที่ไม่ลดลง (หรือกันเลขที่เคยใช้ไว้) และเก็บชื่อร้านไว้ใน draw ตอนสุ่ม\n\n### P2\n\n**EXP-03 · กดสุ่มรัวหรือดับเบิลคลิก ได้หลาย draw** (F04-01)\n- ทำซ้ำ: ดับเบิลคลิก \"สุ่มร้าน\" หรือกด Enter 5 ครั้ง · คาด: 1 POST และประวัติเพิ่ม 1 แถว · ได้: 2 และ 5 POST ตามลำดับ ประวัติเพิ่มแถว \"ไม่ได้ไปกิน\" และ \"สุ่มได้บ่อยใน 7 วัน\" นับเกิน\n- สาเหตุ: ปุ่มถูก disable จาก `rolling` ซึ่งตั้งค่าใน `reveal()` หลัง fetch ตอบกลับแล้ว (`lunch-app.tsx:329-339, 450`)\n- แก้: ตั้ง `rolling` หรือ ref กันกดซ้ำตั้งแต่ก่อนส่ง fetch และปลดเมื่อเกิด error\n\n**EXP-04 · โทษ \"กินแล้ว 7 วัน\" หายเมื่อสุ่มเพิ่มครบ 1,000 ครั้ง** (F01-01)\n- ทำซ้ำ: กินร้าน #84 → สุ่มเพิ่ม 1,000 ครั้ง (`cap.mjs` ใช้ 3.7 วินาที) · คาด: `lastEatenAt` อยู่ครบ 7 วัน · ได้: `null` ตัวคูณกลับเป็น ×1\n- สาเหตุ: `lastEatenAt` คิดจาก `getDraws()` (`server.ts:31-35`) ซึ่งถูกตัดเหลือ 1,000 รายการ (`store.ts:73, 273`) BR-24 จึงขัดกับ BR-25 และ EXP-03 กับ EXP-12 ทำให้ประวัติเต็มเร็วขึ้น\n- แก้: ตอนตัด draws ให้เก็บ draw ที่มี `eatenAt` ภายใน 7 วันไว้ หรือเก็บ `lastEatenAt` แยกไว้ต่อร้าน\n\n**EXP-05 · ลบประเภทที่เป็นประเภทเดียวของร้าน ร้านเหลือ `categories: []`** (F03-02)\n- ทำซ้ำ: `DELETE /api/categories/rice-curry` (ข้อมูลตั้งต้น) · คาด: ถูกบล็อกหรือเตือน (BR-16) · ได้: 200 มี 4 ร้านไม่เหลือประเภท ได้ตัวคูณ ×1 เสมอ และเมื่อทีมโหวต − ทุกประเภท ร้านนี้มีโอกาส 2 เท่าของร้านอื่น\n- สาเหตุ: `deleteCategory` (`store.ts:233-248`) กรองประเภทออกโดยไม่ตรวจว่าร้านจะเหลือประเภทหรือไม่ ส่วน PATCH ตรวจไว้ (`api/restaurants/[id]/route.ts:34`) · ร้านไร้ประเภทได้ ×1 ตาม `odds.ts:105`\n- แก้: ตอบ 409 พร้อมรายชื่อร้านที่จะไม่เหลือประเภท หรือย้ายร้านเหล่านั้นไปประเภท \"อื่น ๆ\" (รอคำตอบ Q4)\n\n**EXP-06 · response ของโหวตที่มาช้าทับ state ห้องที่ใหม่กว่า** (F02-02)\n- ทำซ้ำ: A โหวต (response ช้า 1.5 วินาที) แล้ว B โหวตอีกประเภทระหว่างนั้น · คาด: จอ A ตรงกับ server · ได้: A เห็นข้าวแกง = 0 แต่ server = 1 และค้างจนกว่าจะมี event ถัดไป (% บนกระดานของ A ผิด แต่ผลสุ่มยังถูกเพราะ server ใช้ข้อมูลของตัวเอง)\n- สาเหตุ: `if (res.ok) setRoom(await res.json())` ใน `vote` / `votePick` / `setLazy` (`lunch-app.tsx:270, 295, 311`) ไม่เทียบความใหม่ของข้อมูล\n- แก้: ใส่ `version` หรือ `updatedAt` ใน RoomState และรับ state ที่ใหม่กว่าเท่านั้น (หรือไม่ใช้ response แล้วรอ SSE)\n\n**EXP-07 · โหวตที่ล้มเหลวยังแสดงว่าสำเร็จ ไม่มีข้อความแจ้ง** (F02-08)\n- ทำซ้ำ: อยู่ในห้อง → ห้องหาย (reset หรือหมดอายุ 3 วัน) → กดโหวต · คาด: ย้ เมื่อสุ่มในห้อง |\n| Q4 | ลบประเภทที่เป็นประเภทเดียวของร้าน ร้านนั้นควรเป็นประเภทอะไร | เดิม + F03-02 | ต้องตอบเพื่อแก้ EXP-05: บล็อก (409) หรือย้ายไป \"อื่น ๆ\" |\n| Q5 | แชมป์ 7 วันนับ \"ถูกสุ่มได้\" หรือ \"ไปกินจริง\" | เดิม | EXP-03 ทำให้ตัวเลขนี้เพี้ยนอยู่แล้ว ควรตอบพร้อมกัน |\n| Q6 | เวลา \"กินแล้ว\" ควรเป็นเวลาที่สุ่ม (`createdAt`) หรือเวลาที่กด และกดกับ draw เก่าได้ไหม | F01-10 | เสนอให้กดได้เฉพาะผลล่าสุดของวันนั้น |\n| Q7 | ในห้อง ควรล็อกผลหรือขอยืนยันก่อน \"สุ่มใหม่\" ไหม (กันคนสุ่มซ้ำจนได้ร้านที่ชอบ) | F02-03, US-13 | ใช้ร่วมกับการแก้ EXP-01 เช่น ห้ามสุ่มซ้ำภายใน 10 วินาที |\n| Q8 | ชื่อที่ต่างกันแค่ตัวพิมพ์ / NFC กับ NFD / ตัวอักษรความกว้างศูนย์ นับเป็นคนเดียวกันหรือชื่อซ้ำไหม | F02-06, F03-12 | normalize เป็น NFC ตัด zero-width / control char และเทียบชื่อประเภทแบบไม่สนตัวพิมพ์ |\n| Q9 | ช่องวางพิกัดต้องรองรับรูปแบบไหนบ้าง (DMS, `geo:`, `?daddr=`) | F03-15 | อย่างน้อยรองรับ DMS และเขียนตัวอย่างรูปแบบไว้ใต้ช่อง |\n| Q10 | ประวัติของร้านที่ถูกปิด / ถูกลบ ควรแสดงอย่างไร | F04-11 | เก็บชื่อไว้ใน draw (แก้ EXP-02 ไปด้วย) และติดป้าย \"ไม่สุ่มแล้ว\" / \"ลบแล้ว\" |\n| Q11 | % ปัดเศษแล้วรวมไม่ถึง 100% (BR-14) ยอมรับได้ไหม | F04-07, F01-09 | คง BR-14 ไว้ แล้วเพิ่ม tooltip \"ค่าปัดเศษ\" หรือแสดงทศนิยม 2 ตำแหน่งเมื่อมีร้านเกิน 100 ร้าน |\n\n---\n\n## 5. ความครอบคลุม: สิ่งที่ทั้ง 4 charter ยังไม่ได้สำรวจ\n\n- **ไฟล์ข้อมูลเสียหรือถูกแก้จากข้างนอก** (ความเสี่ยงสูง): ถ้าตอนเริ่ม `restaurants.json` parse ไม่ได้ `readJson` จะคืน `[]` (`store.ts:86-92, 110`) และการเขียนครั้งถัดไปจะทับไฟล์ด้วยรายการว่าง นอกจากนี้ NFR-07 บอกว่า \"แก้ไฟล์จากข้างนอกแล้วโหลดใหม่เอง\" แต่โค้ดโหลดใหม่เฉพาะ `restaurants.json` ส่วน categories / ratings / state ไม่โหลดใหม่ (`store.ts:121-128`) ทั้งสองเรื่องยังไม่มีใครทดสอบจริง\n- **เวลา**: ตัวคูณกินแล้วระหว่างวันที่ 1–7 (BR-06), ห้องหมดอายุ 3 วัน (BR-24), ป้าย \"รอยืนยัน\" ภายใน 2 ชม. (BR-26), เขตเวลา Asia/Bangkok เมื่อ server อยู่คนละโซน (NFR-12) ยังไม่ได้ทดสอบด้วย fake clock\n- **Q2 `openingHours`** และ **FR-22 ดึงข้อมูล OSM ใหม่** (เลขร้านต้องไม่เปลี่ยน และค่าที่ทีมแก้ต้องไม่ถูกทับ) ยังไม่มี charter ไหนแตะ\n- **บริการระยะเดินจริง (OSRM)** และ timeout 4 วินาที (NFR-02) ถูกข้ามในโหมดทดสอบ · ยังไม่ได้วัดประสิทธิภาพตาม NFR-01/02 (2 วินาที / 300 ms)\n- **ฟีเจอร์ค้นหา (TC-SEARCH-\\*)** ไม่อยู่ใน charter ไหนเลย\n- **realtime ในระยะยาว**: server รีสตาร์ตแล้ว EventSource ต่อใหม่เองไหม, listener รั่วเมื่อเปิดปิดแท็บจำนวนมาก, หลาย process (NFR-08)\n- **ห้องบนมือถือ**, หน้า JoinRoom และฟอร์ม `/restaurants/new` ด้วยคีย์บอร์ด, การปักหมุดด้วยคีย์บอร์ด\n- **โปรแกรมอ่านจอจริง** (NVDA / VoiceOver), `prefers-reduced-motion` (NFR-11 กำหนดไว้ แต่ยังไม่ได้ตรวจ), ซูม 200%, โหมดสว่าง/มืด\n- **เบราว์เซอร์อื่น** นอกจาก Chromium (Safari บน iPhone ซึ่งทีมน่าจะใช้มาก, Firefox)\n- แก้ร้านหรือลบประเภทระหว่างที่ห้องกำลังสุ่ม (race ระหว่าง edit กับ draw) และกด \"ไปกิน\" / ยกเลิกพร้อมกันหลายคน\n- ขนาดหมุดตามโอกาสบนแผนที่ (FR-09) เทียบกับ % · หมุดซ้อนกัน \"ร้านในจุดเดียวกัน\" บนมือถือ\n\n---\n\n## 6. test case ใหม่ที่ควรเพิ่มใน `10_TEST-PLAN`\n\n| ID | ชื่อ | ระดับ | กัน EXP |\n|---|---|---|---|\n| TC-ROOM-10 | 3 เบราว์เซอร์ในห้องเดียว A กับ B กดสุ่มพร้อมกัน → `winner[data-number]` ทุกจอ = `latestDraw` ของห้อง (ทำซ้ำ 3 รอบ) | P1 | EXP-01 |\n| TC-ADD-10 | ลบร้านที่เพิ่มเองซึ่งมีเลขสูงสุด แล้วเพิ่มร้านใหม่ → เลขไม่ซ้ำ ไม่มีคะแนน / `lastEatenAt` / โหวตห้องติดมา และ `/history` ยังแสดงชื่อร้านเดิม | P1 | EXP-02 |\n| TC-DRAW-07 | ดับเบิลคลิกและกด Enter 5 ครั้งที่ \"สุ่มร้าน\" → `POST /api/draw` 1 ครั้ง และประวัติเพิ่ม 1 แถว | P2 | EXP-03 |\n| TC-DRAW-08 | กดกินร้าน X แล้วสุ่มเพิ่ม 1,000 ครั้งผ่าน API → X ยังมี `lastEatenAt` และตัวคูณ ×0.2 | P2 | EXP-04 |\n| TC-CAT-06 | ลบประเภทที่เป็นประเภทเดียวของร้าน → ถูกบล็อกหรือย้ายประเภท และไม่มีร้านที่ `categories: []` | P2 | EXP-05 |\n| TC-ROOM-11 | หน่วง response โหวตของ A 1.5 วินาทีขณะที่ B โหวต → `vote-net` บนจอ A ตรงกับ `GET /api/rooms/:code` | P2 | EXP-06 |\n| TC-ROOM-12 | ห้องถูกลบระหว่างเปิดหน้า แล้วโหวต → มีข้อความแจ้ง และปุ่มย้อนเป็น `aria-pressed=false` | P2 | EXP-07 |\n| TC-HOME-05 | ตั้ง localS nc } from \"node:fs\";\nimport { computeOdds, type OddsRestaurant } from \"../src/lib/odds\";\n\ntype Seed = { number: number; distance: number; walkDistance: number | null; categories: string[] };\nconst SEED: Seed[] = JSON.parse(readFileSync(\"e2e/data/restaurants.json\", \"utf8\"));\nconst DAY = 24 * 3600 * 1000;\nconst NOW = Date.parse(\"2026-11-06T12:00:00+07:00\");\n\n// ---------- A. สูตรที่เขียนใหม่จาก requirement ----------\ntype Scenario = {\n  name: string;\n  tc?: string;\n  lazy?: boolean;\n  prices?: number[];\n  scores?: Record<string, number>;\n  picks?: Record<number, number>;\n  edits?: Record<number, Partial<OddsRestaurant>>;\n  focus: number[]; // ร้านที่จะพิมพ์ % ออกมาให้คนอ่านเทียบ\n};\n\nconst voteMult = (net: number) => Math.max(0.1, 1 + 0.5 * net); // BR-03\nconst walkOf = (r: OddsRestaurant) => (r.walkDistance == null ? Math.round(r.distance * 1.3) : r.walkDistance); // BR-09\nfunction eatenMult(iso: string | null | undefined) {\n  // BR-06\n  if (!iso) return 1;\n  const days = Math.max(0, (NOW - Date.parse(iso)) / DAY);\n  return days >= 7 ? 1 : 0.2 + 0.8 * (days / 7);\n}\nconst nearMult = (r: OddsRestaurant, lazy: boolean) => (lazy ? 1 + (1 - Math.min(500, walkOf(r)) / 500) : 1); // BR-08\nconst ratingMult = (avg: number | null | undefined) =>\n  avg == null ? 1 : 0.6 + ((Math.min(4, Math.max(1, avg)) - 1) / 3) * 0.8; // BR-11\n\nfunction expected(list: OddsRestaurant[], s: Scenario) {\n  const scores = s.scores ?? {};\n  const picks = s.picks ?? {};\n  const keep = list.filter(\n    (r) =>\n      !r.disabled && // BR-12\n      (!s.lazy || walkOf(r) <= 500) && // BR-07\n      (!s.prices?.length || s.prices.includes(r.priceLevel ?? 0)), // BR-10\n  );\n  const w = new Map<number, number>();\n  for (const r of keep) {\n    const cat = r.categories.length ? Math.max(...r.categories.map((c) => voteMult(scores[c] ?? 0))) : 1; // BR-04\n    w.set(\n      r.id,\n      r.baseWeight * cat * voteMult(picks[r.id] ?? 0) * eatenMult(r.lastEatenAt) * nearMult(r, !!s.lazy) * ratingMult(r.ratingAvg),\n    );\n  }\n  const total = [...w.values()].reduce((a, b) => a + b, 0);\n  return new Map([...w].map(([id, x]) => [id, total ? x / total : 0])); // BR-01\n}\n\n// BR-14\nconst fmt = (p: number) => (p === 0 ? \"0%\" : p < 0.001 ? \"<0.1%\" : `${(p * 100).toFixed(1)}%`);\n\n// ---------- สถานการณ์ ----------\nconst daysAgo = (d: number) => new Date(NOW - d * DAY).toISOString();\nconst SCENARIOS: Scenario[] = [\n  { name: \"S01 ไม่มีโหวต\", tc: \"TC-HOME-03\", focus: [1, 237] },\n  { name: \"S02 โหวต + ก๋วยเตี๋ยว\", tc: \"TC-VOTE-01\", scores: { noodle: 1 }, focus: [4, 1] },\n  { name: \"S03 โหวต − ฝรั่ง\", tc: \"TC-VOTE-02\", scores: { western: -1 }, focus: [] },\n  { name: \"S04 เส้น −1 ส้มตำ +1 (ร้านหลายแนว)\", tc: \"TC-VOTE-05\", scores: { noodle: -1, isan: 1 }, focus: [222, 4] },\n  { name: \"S05 ห้อง: ส้มตำ +2\", tc: \"TC-ROOM-03\", scores: { isan: 2 }, focus: [222] },\n  { name: \"S06 ห้อง: ก๋วยเตี๋ยว −3 ชนพื้น ×0.1\", scores: { noodle: -3 }, focus: [4] },\n  { name: \"S07 โหวตร้าน #4 +1\", tc: \"TC-VOTE-06\", picks: { 4: 1 }, focus: [4] },\n  { name: \"S08 ขี้เกียจเดิน\", tc: \"TC-FLT-01/06\", lazy: true, focus: [1, 84] },\n  { name: \"S09 กินร้าน #1 วันนี้\", tc: \"TC-DRAW-04\", edits: { 1: { lastEatenAt: daysAgo(0) } }, focus: [1] },\n  { name: \"S10 กินร้าน #1 เมื่อ 3.5 วันก่อน\", edits: { 1: { lastEatenAt: daysAgo(3.5) } }, focus: [1] },\n  { name: \"S11 กินร้าน #1 ครบ 7 วัน\", edits: { 1: { lastEatenAt: daysAgo(7) } }, focus: [1] },\n  { name: \"S12 กินในอนาคต (นาฬิกาเพี้ยน) นับเป็นวันนี้\", tc: \"BUG-01\", edits: { 1: { lastEatenAt: daysAgo(-0.01) } }, focus: [1] },\n  { name: \"S13 น้ำหนักร้าน #2 ×2\", tc: \"TC-EDIT-06\", edits: { 2: { baseWeight: 2 } }, focus: [2] },\n  { name: \"S14 ราคา ฿ (มีแค่ร้าน #1)\", tc: \"TC-FLT-03\", prices: [1], edits: { 1: { priceLevel: 1 }, 2: { priceLevel: 2 } }, focus: [1] },\n  { name: \"S15 ราคา ฿ + ฿฿\", tc: \"TC-FLT-03\", prices: [1, 2], edits: { 1: { priceLevel: 1 }, 2: { priceLevel: 2 } }, focus: [1, 2] },\n  { name: \"S16 ราคา ไม่ระบุ\", tc: \"TC-FLT-04\", prices: [0], edits: { 1: { priceLevel: 1 } }, focus: [2] },\n  { name: \"S17 คะแนนเฉลี่ย 4 ที่ร้าน #1\", tc: \"TC-RATE-04\", edits: { 1: { ratingAvg: 4 } }, focus: [1] },\n  { name: \"S18 คะแนนเฉลี่ย 1 ที่ร้าน #1\", edits: { 1: { ratingAvg: 1 } }, focus: [1] },\n  { name: \"S19 ปิดร้าน #1\", tc: \"TC-EDIT-03\", edits: { 1: { disabled: true } }, focus: [2] },\n  {\n    name: \"S20 ผสมทุกตัวคูณ\",\n    lazy: true,\n    scores: { noodle: 2, thai: -1 },\n    picks: { 4: 1, 1: -1 },\n    edits: { 4: { baseWeight: 1.5, ratingAvg: 2.5, lastEatenAt: daysAgo(3.5) }, 1: { ratingAvg: 4 } },\n    focus: [4, 1, 5],\n  },\n  { name: \"S21 ไม่มีร้านผ่านตัวกรอง\", tc: \"TC-FLT-02\", prices: [4], focus: [] },\n];\n\n// ---------- รันและเทียบ ----------\nfunction build(edits: Scenario[\"edits\"] = {}): OddsRestaurant[] {\n  return SEED.map((r) => ({\n    id: r.number,\n    baseWeight: 1,\n    distance: r.distance,\n    walkDistance: r.walkDistance,\n    categories: r.categories,\n    priceLevel: null,\n    lastEatenAt: null,\n    ratingAvg: null,\n    disabled: false,\n    ...edits[r.number],\n  }));\n}\n\nlet failed = 0;\nfor (const s of SCENARIOS) {\n  const list = build(s.edits);\n  const exp = expected(list, s);\n  const app = computeOdds(list, s.scores ?? {}, { lazy: !!s.lazy, prices: s.prices ?? [] }, NOW, s.picks ?? {});\n  let diff = 0;\n  if (app.length !== exp.size) diff = Infinity;\n  for (const o of app) diff = Math.max(diff, Math.abs(o.p - (exp.get(o.id) ?? NaN)));\n  const ok = diff < 1e-12;\n  if (!ok) failed++;\n  const sum = [...exp.values()].reduce((a, b) => a + b, 0);\n  const focus = s.focus.map((n) => `#${n} ${((exp.get(n) ?? 0) * 100).toFixed(4)}% (${fmt(exp.get(n) ?? 0)})`).join(\" · \");\n  console.log(\n    `${ok ? \"PASS\" : \"FAIL\"} ${s.name.padEnd(42)} ร้าน ${String(exp.size).padStart(3)} · รวม ${(sum * 100).toFixed(2)}%${focus ? \" · \" + focus : \"\"}${s.tc ? ` [${s.tc}]` : \"\"}`,\n  );\n}\n\n// สุ่มสถานการณ์ 500 แบบ เทียบสองสูตรอีกรอบ (property-based)\nconst CATS = [...new Set(SEED.flatMap((r) => r.categories))];\nlet seed = 20261106;\nconst rnd = () => ((seed = (seed * 1103515245 + 12345) % 2 ** 31) / 2 ** 31);\nconst pickOne = <T,>(a: T[]) => a[Math.floor(rnd() * a.length)];\nlet randomFails = 0;\nfor (let i = 0; i < 500; i++) {\n  const edits: Scenario[\"edits\"] = {};\n  for (let k = 0; k < 20; k++) {\n    edits[pickOne(SEED).number] = {\n      baseWeight: pickOne([0.5, 1, 1.5, 2, 5]),\n      priceLevel: pickOne([null, 1, 2, 3, 4]),\n      lastEatenAt: pickOne([null, daysAgo(rnd() * 9)]),\n      ratingAvg: pickOne([null, 1, 1.5, 2.33, 3, 4]),\n      disabled: rnd() < 0.1,\n    };\n  }\n  const s: Scenario = {\n    name: `R${i}`,\n    lazy: rnd() < 0.5,\n    prices: rnd() < 0.3 ? [pickOne([0, 1, 2, 3, 4])] : [],\n    scores: Object.fromEntries(CATS.filter(() => rnd() < 0.3).map((c) => [c, Math.floor(rnd() * 7) - 3])),\n    picks: Object.fromEntries(SEED.filter(() => rnd() < 0.05).map((r) => [r.number, Math.floor(rnd() * 5) - 2])),\n    edits,\n    focus: [],\n  };\n  const list = build(edits);\n  const exp = expected(list, s);\n  const app = computeOdds(list, s.scores!, { lazy: !!s.lazy, prices: s.prices! }, NOW, s.picks);\n  const bad = app.length !== exp.size || app.some((o) => Math.abs(o.p - (exp.get(o.id) ?? NaN)) > 1e-12);\n  if (bad) randomFails++;\n}\nconsole.log(`สุ่มเพิ่ม 500 สถานการณ์: ไม่ตรง ${randomFails} ครั้ง`);\nprocess.exit(failed || randomFails ? 1 : 0);\n\n```\n"}];

  ? `<div class="mermaid">${code.replace(/</g,"&lt;")}</div>`
  : baseCode(code, lang);
renderer.table = (header, body) => `<div class="tablewrap"><table><thead>${header}</thead><tbody>${body}</tbody></table></div>`;
marked.setOptions({ renderer, gfm: true });

const isDark = () => document.documentElement.dataset.theme === "dark" ||
  (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
mermaid.initialize({ startOnLoad: false, theme: "default", securityLevel: "strict", fontFamily: "IBM Plex Sans Thai" });

function docHTML(d) {
  return `<div class="meta">${d.file}</div><article class="doc">${marked.parse(d.md)}</article>`;
}
async function drawDiagrams() {
  try { await mermaid.run({ querySelector: ".mermaid:not([data-processed])" }); } catch (e) { console.warn(e); }
}
function show(key) {
  const i = Math.max(0, DOCS.findIndex(d => d.key === key));
  const d = DOCS[i], prev = DOCS[i-1], next = DOCS[i+1];
  main.innerHTML = docHTML(d) + `<div class="pager">${prev ? `<a href="#${prev.key}">← ${prev.key} ${prev.title}</a>` : "<span></span>"}${next ? `<a href="#${next.key}">${next.key} ${next.title} →</a>` : "<span></span>"}</div>`;
  for (const a of nav.querySelectorAll("a")) a.classList.toggle("on", a.dataset.key === d.key);
  window.scrollTo(0, 0); drawDiagrams();
  document.getElementById("side").classList.remove("open");
}
function showAll() {
  main.innerHTML = DOCS.map(docHTML).join("");
  for (const a of nav.querySelectorAll("a")) a.classList.remove("on");
  drawDiagrams();
}
window.addEventListener("hashchange", () => location.hash === "#all" ? showAll() : show(location.hash.slice(1)));
document.getElementById("allBtn").onclick = () => { location.hash = "all"; };
document.getElementById("themeBtn").onclick = () => {
  document.documentElement.dataset.theme = isDark() ? "light" : "dark";
  try { localStorage.setItem("docs-theme", document.documentElement.dataset.theme); } catch {}
};
document.getElementById("menuBtn").onclick = (e) => {
  const s = document.getElementById("side"); s.classList.toggle("open");
  e.target.setAttribute("aria-expanded", s.classList.contains("open"));
};
try { const t = localStorage.getItem("docs-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
location.hash === "#all" ? showAll() : show(location.hash.slice(1) || DOCS[0].key);
</script>
</body>
</html>
