<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ข้าวไหนดี · เอกสารทั้งหมด</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f5f1; --panel:#ffffff; --side:#efece6; --fg:#1d1b18; --fg2:#57524a; --fg3:#8a847a;
  --line:#e2ddd4; --accent:#c2551f; --accent-soft:#f6e3d8; --code:#f1eee8; --row:#faf8f4;
  --p-green:#2f8f5b; --p-yellow:#b98a12; --p-blue:#2f6fb5; --p-orange:#c2551f; --p-purple:#7b4bb3; --p-gray:#8a847a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151412; --panel:#1c1a18; --side:#121110; --fg:#ece8e1; --fg2:#b5afa5; --fg3:#7f7a71;
    --line:#2e2b27; --accent:#f0883e; --accent-soft:#3a2416; --code:#24211e; --row:#201e1b;
  }
}
:root[data-theme="dark"]{
  --bg:#151412; --panel:#1c1a18; --side:#121110; --fg:#ece8e1; --fg2:#b5afa5; --fg3:#7f7a71;
  --line:#2e2b27; --accent:#f0883e; --accent-soft:#3a2416; --code:#24211e; --row:#201e1b;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:15px/1.7 "IBM Plex Sans Thai",system-ui,sans-serif}
.layout{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
aside{background:var(--side);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;padding:20px 14px 28px}
.brand{font-weight:600;font-size:17px;padding:0 8px}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--fg3)}
.phase{margin:18px 8px 6px;font-size:12px;color:var(--fg3);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
nav a{display:flex;gap:10px;align-items:baseline;padding:6px 8px;border-radius:8px;color:var(--fg2);text-decoration:none;font-size:14px}
nav a:hover{background:var(--panel);color:var(--fg)}
nav a.on{background:var(--accent-soft);color:var(--fg);font-weight:500}
nav a .k{font:500 12px "IBM Plex Mono",monospace;color:var(--fg3);min-width:28px}
.tools{display:flex;gap:6px;margin:18px 8px 0}
.tools button{flex:1;font:inherit;font-size:12px;padding:6px 8px;border:1px solid var(--line);background:var(--panel);color:var(--fg2);border-radius:8px;cursor:pointer}
.tools button:hover{color:var(--fg)}
main{padding:32px clamp(16px,4vw,56px) 80px;max-width:1180px;width:100%}
.meta{font:12px "IBM Plex Mono",monospace;color:var(--fg3);margin-bottom:6px}
.doc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px clamp(16px,3vw,40px);margin-bottom:28px}
.doc h1{font-size:26px;line-height:1.3;margin:0 0 16px}
.doc h2{font-size:20px;margin:34px 0 10px;padding-top:12px;border-top:1px solid var(--line)}
.doc h3{font-size:17px;margin:24px 0 8px}
.doc h4{font-size:15px;margin:20px 0 6px}
.doc a{color:var(--accent)}
.doc code{font:13px "IBM Plex Mono",monospace;background:var(--code);padding:1px 5px;border-radius:5px}
.doc pre{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow:auto}
.doc pre code{background:none;padding:0;font-size:12.5px;line-height:1.55}
.doc blockquote{margin:14px 0;padding:8px 16px;border-left:3px solid var(--accent);background:var(--row);border-radius:0 8px 8px 0;color:var(--fg2)}
.tablewrap{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:10px}
.doc table{border-collapse:collapse;width:100%;font-size:13.5px}
.doc th,.doc td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.doc th{background:var(--row);font-weight:600;white-space:nowrap}
.doc tr:last-child td{border-bottom:0}
.doc img{max-width:100%;border:1px solid var(--line);border-radius:8px}
.mermaid{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;margin:12px 0;text-align:center}
.pager{display:flex;justify-content:space-between;gap:12px}
.pager a{color:var(--fg2);text-decoration:none;font-size:14px;border:1px solid var(--line);padding:8px 14px;border-radius:10px;background:var(--panel)}
.pager a:hover{color:var(--fg)}
.menu{display:none}
@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr)}
  aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);display:none}
  aside.open{display:block}
  .menu{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--side);position:sticky;top:0;z-index:5}
  .menu button{font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px}
  main{padding:20px 16px 60px}
  .doc{padding:20px 16px}
}
@media print{aside,.menu,.pager,.tools{display:none!important}.layout{display:block}.doc{border:0;page-break-after:always}}
</style>
</head>

    <nav id="nav"></nav>
    <div class="tools">

<script>
const DOCS = [{"key": "01", "title": "User Stories", "file": "01_USER-STORIES.md", "phase": "ฟังร้าน", "md": "# 📖 User Stories — ข้าวไหนดี (lunch-draw)\n\nเว็บสุ่มร้านข้าวกลางวันของทีมที่ **อาคารจันวาณิชย์ สีลม** สุ่มจากร้านในรัศมี 1 กม. (237 ร้านจาก OpenStreetMap) โดยทีมช่วยกันปรับโอกาสของแต่ละร้านได้\n\n> **ที่มาของเอกสาร:** ไม่มีบันทึกสัมภาษณ์ตัวจริงเหลืออยู่ เอกสารนี้จึงเรียบเรียงย้อนหลังจากระบบที่สร้างเสร็จแล้ว (ซอร์สโค้ดที่กู้จาก source map ใน `.next/`) และจาก `e2e/test-cases.json` (84 test case) ตัวเลขทุกตัวตรงกับโค้ดใน `src/lib/odds.ts` ถ้าคำตอบของทีมต่างจากนี้ ให้แก้ที่นี่ก่อน แล้วค่อยแก้เอกสารขั้นถัดไป\n\n---\n\n## 1. บันทึกสัมภาษณ์ (สรุป)\n\n| # | ทีมเล่า | สิ่งที่ได้ |\n|---|---|---|\n| 1 | \"เที่ยงทีไรเถียงกันเป็นสิบนาทีว่ากินอะไร สุดท้ายก็ไปร้านเดิม\" | ต้องมีปุ่มเดียวที่ตัดสินให้เลย → **สุ่มร้าน** |\n| 2 | \"แต่ก็ไม่อยากสุ่มมั่ว วันนี้บางคนอยากกินเส้น บางคนไม่เอาอาหารตะวันตก\" | ให้ **โหวตประเภทอาหาร** ด้วยสวิตช์ ไม่เห็นด้วย / ปกติ / เห็นด้วย แล้วใช้ปรับโอกาส ไม่ใช่ตัดร้านทิ้ง |\n| 3 | \"ร้านที่เพิ่งไปเมื่อวานไม่อยากเจออีก\" | ร้านที่ **กินไปแล้ว** โอกาสลดลง แล้วค่อย ๆ คืนกลับภายใน 7 วัน |\n| 4 | \"วันที่ฝนตกหรือร้อนมาก ไม่อยากเดินไกล\" | โหมด **ขี้เกียจเดิน** เอาเฉพาะร้านที่เดินไม่เกิน 500 ม. |\n| 5 | \"ปลายเดือนขอร้านถูก ๆ\" | **กรองราคา** ฿ ถึง ฿฿฿฿ |\n| 6 | \"เวลาไปกันหลายคน อยากให้ทุกคนโหวตจากมือถือตัวเอง แล้วเห็นผลเดียวกัน\" | **ห้อง** ที่แชร์ลิงก์ได้ เห็นโหวตและผลสุ่มแบบ realtime |\n| 7 | \"ข้อมูลจากแผนที่ไม่ครบ บางร้านปิดไปแล้ว บางร้านชื่อในแผนที่ไม่มีใครรู้จัก\" | ทีม **แก้ข้อมูลร้าน** เอง: ชื่อเล่น ประเภทอาหาร ราคา ปิดร้าน เพิ่มร้านใหม่ |\n| 8 | \"ร้านอร่อยควรได้บ่อยกว่า\" | **ให้คะแนนร้าน** (แมว 4 ระดับ) และตั้ง **น้ำหนัก** ร้านโปรด |\n| 9 | \"อยากรู้ว่าสัปดาห์นี้ไปร้านไหนบ่อยสุด\" | หน้า **ประวัติ** และ **แชมป์ 7 วัน** |\n| 10 | \"ไม่อยากต้องสมัครสมาชิก\" | ไม่มีระบบ login · คนเดียวเก็บค่าในเบราว์เซอร์ · ในห้องใช้แค่ชื่อเล่น |\n\n## 2. ผู้ใช้ (Persona)\n\n| Persona | คือใคร | ต้องการอะไร |\n|---|---|---|\n| 🍜 **คนหิว** | พนักงานที่กินข้าวคนเดียวหรือกับเพื่อนไม่กี่คน | กดครั้งเดียวได้ร้าน พร้อมทางเดินไป |\n| 👥 **คนเปิดห้อง** | คนที่ชวนเพื่อนในทีมไปกินด้วยกัน | ให้ทุกคนโหวตพร้อมกัน แล้วสุ่มผลเดียว |\n| 🙋 **สมาชิกห้อง** | เพื่อนที่เปิดลิงก์ห้องจากแชต | เข้าห้องด้วยชื่อเล่น ไม่ต้องสมัคร |\n| 🛠️ **คนดูแลข้อมูลร้าน** | ใครก็ได้ในทีมที่รู้จักร้านแถวออฟฟิศ | แก้ข้อมูลร้านให้ตรงความจริง |\n| 🧪 **ผู้ทดสอบ** | QA / ผู้เรียนที่เขียน e2e | ล้างข้อมูลให้เหมือนเดิมก่อนทุกเทสต์ |\n\n## 3. ภาพรวม\n\n| Epic | Story | ความสำคัญ |\n|---|---|---|\n| A. สุ่มร้าน | US-01 ถึง US-08, US-22, US-23 | Must (ยกเว้น US-04, US-08, US-22, US-23 = Should) |\n| B. ห้องกินด้วยกัน | US-09 ถึง US-14 | Must (ยกเว้น US-14 = Could) |\n| C. ข้อมูลร้าน | US-15 ถึง US-18 | Should (ยกเว้น US-15, US-16 = Must) |\n| D. ประวัติ | US-19 | Should |\n| E. มือถือ | US-20 | Must |\n| F. รองรับการทดสอบ | US-21 | Must |\n\nความสำคัญใช้แบบ **MoSCoW**: Must = ไม่มีแล้วใช้งานไม่ได้ · Should = ควรมีในรอบแรก · Could = มีก็ดี\n\n---\n\n## 4. Stories\n\nรูปแบบ: **ในฐานะ** … **ฉันต้องการ** … **เพื่อ** …\nเงื่อนไขการยอมรับ (Acceptance Criteria) เขียนแบบ Given / When / Then ส่วนคอลัมน์ \"ทดสอบโดย\" อ้างถึง test case ในรายงาน e2e\n\n### Epic A — สุ่มร้าน\n\n#### US-01 ดูโอกาสของแต่ละร้าน · Must\n**ในฐานะ** คนหิว **ฉันต้องการ** เห็นว่าแต่ละร้านมีโอกาสถูกสุ่มกี่เปอร์เซ็นต์ **เพื่อ** เชื่อว่าการสุ่มยุติธรรม\n\n- **Given** ข้อมูลเริ่มต้น 237 ร้าน ยังไม่มีใครโหวต **When** เปิดหน้าแรก **Then** เห็นหัวข้อ \"วันนี้กินร้านไหน\" จำนวนร้าน 237 ประเภทอาหาร 16 แนว และกระดานแสดง 15 อันดับแรก\n- **Given** ยังไม่มีโหวตและไม่มีร้านที่กินแล้ว **Then** ทุกร้านมีโอกาสเท่ากัน 1/237 = 0.4%\n- **When** กด \"แสดงทั้งหมด 237 ร้าน\" **Then** กระดานแสดงทุกร้าน และกด \"แสดงเฉพาะ 15 อันดับแรก\" เพื่อย่อกลับได้\n- ร้านเรียงจากโอกาสมากไปน้อย ถ้าเท่ากันเรียงตามเลขร้าน\n- แต่ละแถวแสดงชื่อร้าน (หรือชื่อเล่น) ระยะเดิน ประเภทอาหาร และตัวคูณที่มีผล\n\nทดสอบโดย: TC-HOME-01, TC-HOME-02, TC-HOME-03\n\n#### US-02 สุ่มร้าน · Must\n**ในฐานะ** คนหิว **ฉันต้องการ** กดปุ่มเดียวแล้วได้ร้าน พร้อมวิธีเดินไป **เพื่อ** ไม่ต้องเถียงกันอีก\n\n- **When** กด \"สุ่มร้าน\" **Then** มีแอนิเมชันสั้น ๆ แล้วการ์ดผลแสดงชื่อร้าน ระยะเดิน (ม.) เวลาเดิน (นาที) และโอกาสที่ร้านนี้มีตอนสุ่ม\n- การ์ดผลมีลิงก์ Google Maps ที่ตรงพิกัดร้าน และลิงก์นำทางจากออฟฟิศแบบ **เดิน**\n- หลังได้ผล ปุ่มเปลี่ยนเป็น \"สุ่มใหม่\"\n- การสุ่มทำที่ server เสมอ และใช้ตัวสุ่มที่ปลอดภัย (crypto) ร้านที่ถูกปิดหรือไม่ผ่านตัวกรองต้องไม่ถูกสุ่ม\n- **Given** ไม่มีร้านเหลือหลังกรอง **Then** ปุ่มสุ่มร้านกดไม่ได้ และ API ตอบ 409 \"ไม่มีร้านให้สุ่ม…\"\n\nทดสอบโดย: TC-DRAW-01, TC-DRAW-02, TC-DRAW-03, TC-API-04\n\n#### US-03 โหวตประเภทอาหาร · Must\n**ในฐานะ** คนหิว **ฉันต้องการ** บอกว่าวันนี้อยากหรือไม่อยากกินแนวไหน **เพื่อ** ให้ร้านแนวนั้นมีโอกาสมากหรือน้อยลง โดยไม่ตัดร้านทิ้ง\n\n- แต่ละประเภทมีสวิตช์ 3 ช่อง **ไม่เห็นด้วย | ปกติ | เห็นด้วย** (= −1, 0, +1) เลือกได้ทีละช่อง ค่าเริ่มต้นคือ ปกติ\n- ตัวคูณของแนว = 1 + 0.5 × คะแนนสุทธิ (ต่ำสุด ×0.1) เช่น +1 = ×1.5, −1 = ×0.5, +2 = ×2.0\n- **When** เลือก เห็นด้วย ที่ \"ก๋วยเตี๋ยว / เมนูเส้น\" **Then** สวิตช์อยู่ที่ เห็นด้วย และแสดง ×1.5 ร้านอันดับ 1 เป็นร้านก๋วยเตี๋ยว\n- **When** เลือก ปกติ **Then** ยกเลิกโหวต กลับเป็น 0 และไม่แสดงตัวคูณ\n- ร้านที่มีหลายแนว ใช้ตัวคูณของ **แนวที่ดีที่สุด** (เช่น เส้น −1 ส้มตำ +1 → ร้านที่เป็นทั้งสองแนวได้ ×1.5)\n- **Given** ใช้คนเดียว **When** รีโหลดหน้า **Then** โหวตยังอยู่ (เก็บในเบราว์เซอร์)\n\nทดสอบโดย: TC-VOTE-01 ถึง TC-VOTE-05\n\n#### US-04 โหวตรายร้าน · Should\n**ในฐานะ** คนหิว **ฉันต้องการ** เลือก เห็นด้วย / ไม่เห็นด้วย กับร้านที่อยากหรือไม่อยากไปเป็นรายร้าน **เพื่อ** ปรับละเอียดกว่าระดับประเภทอาหาร\n\n- ใช้สูตรเดียวกับประเภทอาหาร: ×(1 + 0.5 × คะแนนสุทธิ) ต่ำสุด ×0.1\n- ใช้สวิตช์ 3 ช่องแบบเดียวกัน คนเดียวโหวตได้ร้านละ −1, 0, +1 ในห้องรวมคะแนนของทุกคน และแสดงผลรวมข้างสวิตช์ (เช่น \"รวม +2\")\n\nทดสอบโดย: TC-VOTE-06, TC-VOTE-07, TC-VOTE-08, TC-ROOM-09, TC-API-06\n\n#### US-05 โหมดขี้เกียจเดิน · Must\n**ในฐานะ** คนหิวที่ไม่อยากเดินไกล **ฉันต้องการ** เปิดสวิตช์ให้เหลือเฉพาะร้านใกล้ **เพื่อ** ไปถึงเร็ว\n\n- **When** เปิด \"ขี้เกียจเดิน\" **Then** เหลือเฉพาะร้านที่เดินไม่เกิน **500 ม.** (ข้อมูลเริ่มต้นเหลือ 49 ร้าน)\n- ในโหมดนี้ ร้านยิ่งใกล้ยิ่งมีโอกาสมาก: ×2.0 ที่หน้าออฟฟิศ ลดลงเป็นเส้นตรงจนเหลือ ×1.0 ที่ 500 ม.\n- ถ้าไม่รู้ระยะเดินจริง ประมาณจากระยะเส้นตรง × 1.3\n- ผลสุ่มทุกครั้งในโหมดนี้ต้องเดินไม่เกิน 500 ม. (ทดสอบซ้ำ 25 ครั้ง)\n- **When** รีโหลดหน้า **Then** สวิตช์ยังเปิดอยู่\n\nทดสอบโดย: TC-FLT-01, TC-FLT-05, TC-FLT-06, TC-DRAW-02\n\n#### US-06 กรองราคา · Must\n**ในฐานะ** คนหิวช่วงปลายเดือน **ฉันต้องการ** เลือกช่วงราคาที่รับได้ **เพื่อ** ไม่ได้ร้านแพงเกินงบ\n\n- ช่วงราคา: ฿ (ไม่เกิน 60) · ฿฿ (60–120) · ฿฿฿ (120–250) · ฿฿฿฿ (250 ขึ้นไป) · **ไม่ระบุ** (ร้านที่ยังไม่มีใครใส่ราคา)\n- เลือกได้หลายช่วงพร้อมกัน กด \"ทุกราคา\" เพื่อล้างตัวกรอง\n- **Given** ร้าน #1 ราคา ฿ และร้าน #2 ราคา ฿฿ **When** กด ฿ **Then** เหลือ 1 ร้าน 100% **When** กด ฿฿ เพิ่ม **Then** เหลือ 2 ร้าน ร้านละ 50%\n- **Given** ยังไม่มีร้านไหนมีราคา **When** กด ฿ **Then** แสดง \"ไม่มีร้านที่ตรงกับตัวกรองนี้\" และปุ่มสุ่มร้านกดไม่ได้\n\nทดสอบโดย: TC-FLT-02, TC-FLT-03, TC-FLT-04\n\n#### US-07 บันทึกว่าไปกินแล้ว · Must\n**ในฐานะ** คนหิว **ฉันต้องการ** ยืนยันว่าไปกินร้านที่สุ่มได้จริง **เพื่อ** ไม่เจอร้านเดิมซ้ำในวันถัด ๆ ไป\n\n- **When** กด \"ไปกินร้านนี้\" บนการ์ดผล **Then** ปุ่มเปลี่ยนเป็น \"บันทึกว่ากินร้านนี้แล้ว\" และแถวของร้านแสดง \"ไปกินมาวันนี้ ×0.2\" **ทันที** โดยไม่ต้องรีโหลด\n- ตัวคูณเริ่มที่ ×0.2 ในวันที่กิน แล้วเพิ่มขึ้นเป็นเส้นตรงจนกลับเป็น ×1.0 เมื่อครบ 7 วัน\n- **When** กดปุ่มอีกครั้ง **Then** ยกเลิกได้ โอกาสกลับเป็นปกติ\n- **When** รีโหลดหน้า **Then** ยังแสดง \"ไปกินมาวันนี้\" (บันทึกที่ server)\n\nทดสอบโดย: TC-DRAW-04, TC-DRAW-05, TC-DRAW-06 (เคยพบ BUG-01 ตัวคูณไม่ลดจนกว่าจะรีโหลด แก้แล้ว)\n\n#### US-08 ให้คะแนนร้านด้วยแมว · Should\n**ในฐานะ** คนที่เพิ่งกินกลับมา **ฉันต้องการ** ให้คะแนนร้าน **เพื่อ** ให้ร้านอร่อยถูกสุ่มบ่อยขึ้น\n\n- 4 ระดับ: อร่อยมาก (4) · โอเค (3) · เฉยๆ (2) · ไม่ไหว (1) แสดงเป็นรูปแมว\n- เบราว์เซอร์หนึ่งเครื่องให้ได้ร้านละ 1 คะแนน เปลี่ยนหรือถอนคืนได้\n- ตัวคูณจากคะแนนเฉลี่ย: เฉลี่ย 1 = ×0.6 ถึง เฉลี่ย 4 = ×1.4 · ยังไม่มีใครให้ = ×1.0\n- ให้คะแนนได้จากการ์ดผลการสุ่ม และจากแผงร้านบนแผนที่ คนอื่นเห็นค่าเฉลี่ยใหม่ทันที\n\nทดสอบโดย: TC-RATE-01 ถึง TC-RATE-07\n\n#### US-22 ดูร้านบนแผนที่ · Should\n**ในฐานะ** คนหิว **ฉันต้องการ** สลับกระดานเป็นแผนที่ **เพื่อ** เห็นว่าร้านอยู่ตรงไหนเทียบกับออฟฟิศ\n\n- **When** สลับเป็นมุมมองแผนที่ **Then** เห็นหมุดทุกร้านที่ผ่านตัวกรอง (เปิดขี้เกียจเดินแล้วเหลือหมุดตาม)\n- หมุดที่มีโอกาสสูงมีขนาดใหญ่กว่า\n- ชี้หมุดเห็นชื่อร้าน · กดหมุดแล้วแผงด้านขวาแสดงร้าน โอกาส ปุ่มโหวต และคะแนน · กดหมุดอื่นแล้วแผงเปลี่ยนตาม\n- ร้านที่อยู่จุดเดียวกัน (ตึกเดียวกัน) มีรายการ \"ร้านในจุดเดียวกัน\" ให้เลือก\n- สุ่มร้านบนแผนที่ได้ หมุดของร้านที่ได้เด่นขึ้น และสลับกลับไปมุมมองรายการได้\n- ถ้าโหลดแผนที่พื้นหลังไม่ได้ หมุดยังต้องขึ้น\n\nทดสอบโดย: TC-MAP-01 ถึง TC-MAP-07 (เคยพบ BUG-03, BUG-04, BUG-05 แก้แล้ว)\n\n#### US-23 ค้นหาร้าน · Should\n**ในฐานะ** คนหิว **ฉันต้องการ** พิมพ์หาร้านที่อยากรู้โอกาส **เพื่อ** ไม่ต้องเลื่อนหาใน 237 ร้าน\n\n- ช่องค้นหาเหนือกระดาน ค้นได้จากชื่อร้าน ชื่อเล่น ประเภทอาหาร หรือเบอร์ร้าน (`#12`)\n- **When** พิมพ์ \"ก๋วยเตี๋ยว\" **Then** แสดงเฉพาะร้านที่ตรง และบอก \"พบ N ร้าน\"\n- การค้นหา **ไม่เปลี่ยน** โอกาส จำนวนร้านที่สุ่มได้ หรือผลสุ่ม (แค่ซ่อนแถว)\n- ถ้าร้านที่ตรงคำค้นถูกตัวกรองซ่อนไว้ บอกว่า \"อีก N ร้านตรงคำค้นแต่ถูกตัวกรองซ่อนไว้\"\n- ล้างคำค้นด้วยปุ่ม X หรือ Esc แล้วกลับมาแสดง 15 อันดับแรก\n- บนแผนที่ เหลือเฉพาะหมุดที่ตรง และแผงขวาแสดง \"ผลการค้นหา N ร้าน\"\n\nทดสอบโดย: TC-SEARCH-01 ถึง TC-SEARCH-05\n\n### Epic B — ห้องกินด้วยกัน\n\n#### US-09 เปิดห้อง · Must\n**ในฐานะ** คนเปิดห้อง **ฉันต้องการ** สร้างห้องแล้วได้ลิงก์ไปแชร์ **เพื่อ** ชวนเพื่อนมาโหวตด้วยกัน\n\n- **When** กด \"สร้างห้อง\" **Then** ได้ URL `/room/XXXX` รหัส 4 ตัว ที่ไม่มี 0, O, 1, I (อ่านออกเสียงง่าย)\n- ตัวกรองที่ตั้งไว้ตอนเปิดห้อง (ขี้เกียจเดิน, ราคา) ติดไปกับห้อง\n\nทดสอบโดย: TC-ROOM-01\n\n#### US-10 เข้าห้องด้วยชื่อเล่น · Must\n**ในฐานะ** สมาชิกห้อง **ฉันต้องการ** เข้าห้องโดยใส่แค่ชื่อเล่น **เพื่อ** ไม่ต้องสมัครสมาชิก\n\n- **Given** ยังไม่ใส่ชื่อเล่น **Then** ปุ่ม \"เข้าห้อง\" กดไม่ได้\n- **When** ใส่ \"ต้น\" แล้วเข้าห้อง **Then** เห็น \"ห้อง XXXX\" และ \"1 คนในห้อง · คุณคือ ต้น\"\n- ชื่อเล่นยาวได้ไม่เกิน 24 ตัวอักษร ใช้ชื่อเดิมซ้ำในห้องเดียวกัน = คนเดิม (ได้ member id เดิม)\n- **When** คนที่สองเปิดลิงก์และเข้าห้อง **Then** จอของคนแรกเปลี่ยนเป็น \"2 คนในห้อง\" ภายใน 3 วินาที โดยไม่ต้องรีโหลด\n\nทดสอบโดย: TC-ROOM-01, TC-ROOM-02, TC-ROOM-07\n\n#### US-11 โหวตร่วมกันแบบ realtime · Must\n**ในฐานะ** สมาชิกห้อง **ฉันต้องการ** เห็นโหวตของเพื่อนทันที **เพื่อ** รู้ว่าทีมอยากกินอะไร\n\n- โหวตของทุกคนรวมกันเป็นคะแนนสุทธิของแนว เช่น ต้น +1 มิว +1 → ส้มตำ +2 ×2.0\n- การเปลี่ยนแปลงไปถึงทุกจอภายใน 3 วินาที\n- คนที่ไม่ได้อยู่ในห้องโหวตไม่ได้ (404) · ประเภทอาหารที่ไม่มีอยู่หรือค่านอกจาก −1, 0, +1 ได้ 400\n\nทดสอบโดย: TC-ROOM-03, TC-API-01, TC-API-02, TC-API-05\n\n#### US-12 ตัวกรองของห้องใช้ร่วมกัน · Must\n**ในฐานะ** สมาชิกห้อง **ฉันต้องการ** ให้ตัวกรองเป็นของทั้งห้อง **เพื่อ** ทุกคนเห็นรายชื่อร้านชุดเดียวกัน\n\n- **When** มิวเปิด \"ขี้เกียจเดิน\" **Then** จอของต้นเหลือ 49 ร้านและสวิตช์เปิดตาม\n- **When** มิวกดราคา \"ไม่ระบุ\" **Then** จอของต้นขึ้น \"กรองราคา\" ภายใน 3 วินาที\n\nทดสอบโดย: TC-ROOM-04\n\n#### US-13 สุ่มร้านในห้อง ทุกคนเห็นผลเดียวกัน · Must\n**ในฐานะ** สมาชิกห้อง **ฉันต้องการ** ให้ใครก็ได้กดสุ่มร้าน แล้วทุกคนเห็นร้านเดียวกัน **เพื่อ** ไม่มีใครแอบสุ่มใหม่\n\n- สุ่มที่ server ด้วยโหวตและตัวกรองของห้อง (ไม่ใช้ค่าที่ส่งมาจากเบราว์เซอร์)\n- **When** ต้นกด \"สุ่มร้าน\" **Then** จอของมิวแสดงการ์ดผลเป็นร้านเดียวกัน\n- การแก้ข้อมูลร้าน (เช่น ตั้งชื่อเล่น) ก็ไปถึงทุกจอภายใน 3 วินาที\n\nทดสอบโดย: TC-ROOM-05, TC-ROOM-06\n\n#### US-14 ห้องที่ไม่มีอยู่หรือหมดอายุ · Could\n**ในฐานะ** สมาชิกห้อง **ฉันต้องการ** รู้ทันทีถ้าลิงก์ห้องใช้ไม่ได้ **เพื่อ** ไม่ต้องรอเปล่า\n\n- **When** เปิด `/room/ZZZZ` ที่ไม่มีอยู่ **Then** หน้า 404 และ API `GET /api/rooms/ZZZZ` ตอบ 404\n- ห้องที่ไม่มีความเคลื่อนไหว 3 วัน ถูกลบอัตโนมัติ\n\nทดสอบโดย: TC-ROOM-08\n\n### Epic C — ข้อมูลร้าน\n\n#### US-15 แก้ข้อมูลร้าน · Must\n**ในฐานะ** คนดูแลข้อมูลร้าน **ฉันต้องการ** แก้ข้อมูลร้านจากกระดาน **เพื่อ** ให้ตรงกับที่ทีมรู้จัก\n\n- กดที่แถวร้านเพื่อเปิดหน้าแก้ไข\n- **ชื่อเล่น** (ไม่เกิน 40 ตัวอักษร): แสดงแทนชื่อจริง มีชื่อจริงตัวเล็กอยู่ใต้ ลบจนว่างแล้วกลับเป็นชื่อจริง\n- **ประเภทอาหาร**: ต้องเลือกอย่างน้อย 1 แนว ถ้าไม่เลือกเลย ปุ่มบันทึกกดไม่ได้ ตัวนับร้านของแนวอัปเดตตาม\n- **ตัวคูณโอกาส**: 0.5–5 ขั้นละ 0.5 (ค่าเริ่ม ×1) เช่น ×2 ทำให้โอกาสเป็นสองเท่า → 2 ÷ 238\n- **ราคา**: ฿ ถึง ฿฿฿฿ หรือไม่ระบุ\n- บันทึกลงไฟล์ข้อมูล รีโหลดแล้วยังอยู่ · ค่าที่ไม่ถูกต้องได้ 400 · ร้านที่ไม่มีได้ 404\n\nทดสอบโดย: TC-EDIT-01, TC-EDIT-02, TC-EDIT-04 ถึง TC-EDIT-07, TC-API-03\n\n#### US-16 ปิด / เปิดร้าน · Must\n**ในฐานะ** คนดูแลข้อมูลร้าน **ฉันต้องการ** ปิดร้านที่เลิกกิจการหรือไม่มีใครไป **เพื่อ** ไม่ให้ถูกสุ่มอีก\n\n- **When** กด \"ไม่สุ่มร้านนี้\" **Then** ร้านหายจากกระดาน จำนวนร้านลดลง 1 และไม่ถูกสุ่มอีก\n- รายการ \"ร้านที่ไม่สุ่ม\" แสดงจำนวนและรายชื่อ กด \"กลับมาสุ่ม\" เพื่อคืนร้าน\n\nทดสอบโดย: TC-EDIT-03, TC-DRAW-03\n\n#### US-17 เพิ่มร้านเอง · Should\n**ในฐานะ** คนดูแลข้อมูลร้าน **ฉันต้องการ** เพิ่มร้านที่ไม่มีในแผนที่ **เพื่อ** ให้ร้านเปิดใหม่ถูกสุ่มได้ด้วย\n\n- หน้า `/restaurants/new`: ใส่ชื่อร้าน (ไม่เกิน 80 ตัวอักษร) และประเภทอาหารอย่างน้อย 1 แนว ส่วนชื่อเล่น ราคา และเวลาเปิด ไม่บังคับ\n- ระบุตำแหน่งได้โดยจิ้มบนแผนที่ หรือวางพิกัด / ลิงก์ Google Maps\n- ร้านต้องอยู่ไม่เกิน **2 กม.** จากออฟฟิศ ไม่อย่างนั้นแจ้ง \"ร้านอยู่ไกลเกิน 2 กม. จากออฟฟิศ\"\n- ระบบคำนวณระยะเดินจริงให้ ถ้าบริการคำนวณเส้นทางไม่ตอบใน 4 วินาที ใช้ระยะเส้นตรง × 1.3\n- ร้านที่เพิ่มเองลบได้ ส่วนร้านจาก OpenStreetMap ลบไม่ได้ ให้ใช้ปิดร้านแทน (409)\n- ร้านใหม่ขึ้นบนกระดานของทุกคนทันที (เคยพบ BUG-02 ต้องรีโหลดก่อน แก้แล้ว)\n\nทดสอบโดย: TC-ADD-01 ถึง TC-ADD-09\n\n#### US-18 จัดการประเภทอาหาร · Should\n**ในฐานะ** คนดูแลข้อมูลร้าน **ฉันต้องการ** เพิ่ม เปลี่ยนชื่อ หรือลบประเภทอาหาร **เพื่อ** ให้หมวดตรงกับร้านแถวออฟฟิศ\n\n- หน้า `/categories` แสดงทุกแนวพร้อมจำนวนร้าน (ไม่นับร้านที่ปิด)\n- ชื่อแนวห้ามว่าง ยาวไม่เกิน 30 ตัวอักษร และห้ามซ้ำ (ซ้ำได้ 409 \"มีประเภทอาหารนี้อยู่แล้ว\")\n- ลบแนวแล้ว แนวนั้นหายจากทุกร้านและจากโหวตในทุกห้อง\n- แนวที่เพิ่มใหม่ใช้โหวตได้ทันที\n\nทดสอบโดย: TC-CAT-01 ถึง TC-CAT-05\n\n### Epic D — ประวัติ\n\n#### US-19 ดูประวัติและแชมป์ · Should\n**ในฐานะ** คนหิว **ฉันต้องการ** ดูว่าสุ่มได้ร้านไหนมาบ้าง **เพื่อ** รู้ว่าทีมไปไหนบ่อย\n\n- เมนู \"ประวัติ\" ไปหน้า `/history` หัวข้อ \"สุ่มได้บ่อยใน 7 วัน\"\n- รายการล่าสุดเรียงใหม่สุดก่อน ทุกแถวมีป้ายสถานะ: **ไปกิน** / **ไม่ได้ไปกิน** / **รอยืนยัน** และบอกว่าสุ่มในโหมดขี้เกียจเดินหรือไม่\n- **Given** ยังไม่มีการสุ่ม **Then** ทั้งสองส่วนแสดง \"ยังไม่เคยสุ่ม\"\n- เก็บผลการสุ่มล่าสุดไม่เกิน 1,000 ครั้ง\n\nทดสอบโดย: TC-HOME-04, TC-HIST-01, TC-HIST-02, TC-HIST-03\n\n### Epic E — มือถือ\n\n#### US-20 ใช้บนมือถือได้สะดวก · Must\n**ในฐานะ** คนหิวที่ถือมือถือเดินออกจากออฟฟิศ **ฉันต้องการ** กดสุ่มร้านได้ทันทีที่เปิดเว็บ **เพื่อ** ไม่ต้องเลื่อนหา\n\n- จอ 390×844: ปุ่มสุ่มร้านอยู่เหนือโอกาสของแต่ละร้าน และเห็นได้โดยไม่ต้องเลื่อน\n- หน้าไม่กว้างเกินจอ (ไม่มี scroll แนวนอน)\n- **When** กดสุ่มร้าน **Then** การ์ดผลเลื่อนขึ้นมาอยู่ในจอ (อย่างน้อย 30% ของการ์ด)\n\nทดสอบโดย: TC-MOB-01, TC-MOB-02\n\n### Epic F — รองรับการทดสอบ\n\n#### US-21 ล้างข้อมูลก่อนทดสอบ · Must\n**ในฐานะ** ผู้ทดสอบ **ฉันต้องการ** คืนข้อมูลเป็นค่าเริ่มต้นได้ด้วยคำสั่งเดียว **เพื่อ** ให้ทุกเทสต์เริ่มจากสภาพเดียวกัน\n\n- `POST /api/test/reset` คืนร้าน ประเภทอาหาร คะแนน ห้อง และผลการสุ่มเป็นค่าเริ่มต้น (237 ร้าน, 16 แนว)\n- ใช้ได้เฉพาะเมื่อเปิดเซิร์ฟเวอร์ด้วย `LUNCH_TEST=1` ไม่อย่างนั้นตอบ 404\n- ในโหมดทดสอบ ไม่เรียกบริการคำนวณเส้นทางภายนอก เพื่อให้ผลไม่ขึ้นกับอินเทอร์เน็ต\n- ข้อมูลทดสอบแยกโฟลเดอร์ (`e2e/.data`) ไม่ปนกับข้อมูลจริง\n\nทดสอบโดย: ใช้ใน setup ของทุก test\n\n---\n\n## 5. สูตรโอกาส (สรุปจากทุก story)\n\n```\nน้ำหนักร้าน = ตัวคูณโอกาส            (US-15  0.5–5)\n            × ตัวคูณแนวที่ดีที่สุด        (US-03  1 + 0.5 × โหวต, ต่ำสุด 0.1)\n            × ตัวคูณโหวตรายร้าน         (US-04  สูตรเดียวกัน)\n            × ตัวคูณกินไปแล้ว           (US-07  0.2 → 1.0 ภายใน 7 วัน)\n            × ตัวคูณระยะใกล้            (US-05  2.0 → 1.0 เฉพาะโหมดขี้เกียจเดิน)\n            × ตัวคูณคะแนนแมว           (US-08  0.6 → 1.4)\n\nโอกาส % = น้ำหนักร้าน ÷ ผลรวมน้ำหนักของทุกร้านที่ผ่านตัวกรอง (US-05, US-06, US-16)\n```\n\n## 6. นอกขอบเขต\n\n- ระบบสมาชิก / login (ใช้ชื่อเล่นในห้องแทน)\n- สั่งอาหาร จองโต๊ะ หรือจ่ายเงิน\n- ร้านนอกรัศมีรอบออฟฟิศ (ดึงจากแผนที่ 1 กม. เพิ่มเองได้ไม่เกิน 2 กม.)\n- เวลาเปิดปิดร้าน: เก็บไว้แสดง แต่ยังไม่ใช้กรองร้านที่ปิดอยู่ตอนนี้\n\n## 7. ความครอบคลุมของ test case\n\nทุก story มี test case อย่างน้อย 1 ข้อ (รวม 84 ข้อใน `e2e/test-cases.json` และเพิ่มอีก 20 ข้อจากการสำรวจใน `10_TEST-PLAN.md`) ยกเว้นเงื่อนไขย่อยต่อไปนี้ที่ยังไม่มีใครทดสอบ\n\n| Story | เงื่อนไขที่ยังไม่มี test |\n|---|---|\n| US-05 | ไม่รู้ระยะเดินจริง แล้วใช้ระยะเส้นตรง × 1.3 |\n| US-07 | ตัวคูณค่อย ๆ คืนกลับระหว่างวันที่ 1–7 (มีแค่ unit test) |\n| US-14 | ห้องถูกลบเมื่อไม่มีความเคลื่อนไหว 3 วัน |\n| US-19 | เก็บผลการสุ่มไม่เกิน 1,000 ครั้ง |\n"}, {"key": "02", "title": "Requirements", "file": "02_REQUIREMENTS.md", "phase": "ฟังร้าน", "md": "# 📐 Requirements — ข้าวไหนดี (lunch-draw)\n\nต่อจาก `01_USER-STORIES.md` หลังทีม (\"ร้าน\" = ทีมที่ใช้งาน) ตอบกลับ story ทุกข้อ แล้วแตกเป็น 3 กลุ่ม\n\n| กลุ่ม | ย่อ | ตอบคำถาม |\n|---|---|---|\n| Functional Requirement | **FR** | ระบบต้อง **ทำอะไร** ได้ |\n| Business Rule | **BR** | ตัวเลขและกติกาที่ **ต้องถูกเป๊ะ** |\n| Non-Functional Requirement | **NFR** | ต้องทำได้ **ดีแค่ไหน** (เร็ว ปลอดภัย ใช้ง่าย) |\n\nทุกข้อในเอกสารนี้ตรงกับโค้ดปัจจุบัน และอ้างไฟล์ที่ใช้ตรวจได้\n\n---\n\n## 1. คำตอบจากทีม (สรุปการคุยรอบสอง)\n\n| # | คำถามที่ถามกลับ | ทีมตอบ | กลายเป็น |\n|---|---|---|---|\n| 1 | โหวต − แล้วตัดร้านทิ้งเลยไหม | ไม่ตัด แค่ลดโอกาส เผื่อวันไหนไม่มีทางเลือก | BR-03 ต่ำสุด ×0.1 |\n| 2 | ร้านที่มีหลายแนว คิดแนวไหน | แนวที่ดีที่สุด เพราะ \"ร้านนี้มีสิ่งที่เราอยากกิน\" | BR-04 |\n| 3 | กินแล้วห้ามซ้ำกี่วัน | ไม่ห้าม แต่ลดมาก ๆ วันแรก แล้วคืนใน 1 สัปดาห์ | BR-06 |\n| 4 | ขี้เกียจเดินกี่เมตร | 500 ม. และร้านติดออฟฟิศควรได้บ่อยกว่า | BR-07, BR-08 |\n| 5 | ราคาแบ่งยังไง | 4 ช่วงต่อคน + \"ไม่ระบุ\" เพราะร้านส่วนใหญ่ยังไม่มีใครใส่ | BR-10 |\n| 6 | ใครแก้ข้อมูลร้านได้ | ทุกคนในทีม ไม่ต้อง login เชื่อใจกัน | NFR-09 (ความเสี่ยงที่ยอมรับ) |\n| 7 | ร้านจากแผนที่ลบได้ไหม | ไม่ ให้ปิดแทน เวลาดึงข้อมูลใหม่จะได้ไม่กลับมา | BR-15 |\n| 8 | ในห้อง ใครกดสุ่มร้าน | ใครก็ได้ แต่ทุกคนต้องเห็นผลเดียวกัน | FR-13, NFR-04 |\n| 9 | ต้องใช้ database ไหม | ไม่อยากดูแล ขอเป็นไฟล์ commit ลง git ได้ | NFR-07 |\n| 10 | ให้คะแนนร้านกี่ระดับ | 4 ระดับ เป็นรูปแมว สนุกกว่าดาว | BR-11 |\n\n---\n\n## 2. Functional Requirements (FR)\n\n| ID | ระบบต้อง… | Story | ที่อยู่ในโค้ด |\n|---|---|---|---|\n| **FR-01** | แสดงโอกาสของแต่ละร้าน: จำนวนร้านที่สุ่มได้, ประเภทอาหารพร้อมจำนวนร้าน, 15 อันดับแรก, ปุ่มแสดงทั้งหมด / ย่อกลับ | US-01 | `odds-board.tsx` |\n| **FR-02** | สุ่มร้านที่ server แล้วแสดงการ์ดผล: ชื่อร้าน ระยะเดิน เวลาเดิน โอกาส ลิงก์ Google Maps และลิงก์นำทางแบบเดิน | US-02 | `api/draw`, `lunch-app.tsx` |\n| **FR-03** | ให้โหวตประเภทอาหารด้วยสวิตช์ 3 ช่อง ไม่เห็นด้วย / ปกติ / เห็นด้วย (−1 / 0 / +1) ต่อคนต่อประเภท เลือก ปกติ เพื่อยกเลิก · ในห้องแสดงผลรวมข้างสวิตช์ | US-03 | `category-votes.tsx` |\n| **FR-04** | ให้โหวตรายร้านด้วยสวิตช์ 3 ช่องเดียวกัน จากกระดานและจากแผนที่ (บนมือถือสวิตช์อยู่บรรทัดใต้ชื่อร้าน) | US-04 | `vote-control.tsx` |\n| **FR-05** | มีสวิตช์ \"ขี้เกียจเดิน\" | US-05 | `lunch-app.tsx` |\n| **FR-06** | กรองราคาได้หลายช่วงพร้อมกัน และมีปุ่ม \"ทุกราคา\" ล้างตัวกรอง | US-06 | `price-filter.tsx` |\n| **FR-07** | บันทึก / ยกเลิก \"ไปกินร้านนี้\" จากการ์ดผล | US-07 | `api/draws/[id]` |\n| **FR-08** | ให้คะแนนร้านด้วยแมว 4 ระดับ เปลี่ยนและถอนได้ จากการ์ดผลและแผงแผนที่ | US-08 | `rating.tsx`, `api/restaurants/[id]/rating` |\n| **FR-09** | สลับกระดาน ↔ แผนที่ หมุดตามตัวกรอง ขนาดตามโอกาส ชี้เห็นชื่อ กดเห็นแผงรายละเอียด และรายการ \"ร้านในจุดเดียวกัน\" | US-22 | `odds-map.tsx` |\n| **FR-10** | เปิดห้อง ได้รหัส 4 ตัวและลิงก์ `/room/CODE` | US-09 | `api/rooms` |\n| **FR-11** | เข้าห้องด้วยชื่อเล่น ชื่อซ้ำ = คนเดิม แสดงจำนวนคนและ \"คุณคือ …\" | US-10 | `api/rooms/[code]/members` |\n| **FR-12** | รวมโหวตและตัวกรองของทุกคนในห้อง ส่งให้ทุกจอแบบ realtime | US-11, US-12 | `api/rooms/[code]/votes`, `api/events` |\n| **FR-13** | สุ่มร้านในห้องด้วยข้อมูลของห้อง ทุกจอเห็นผลเดียวกัน | US-13 | `api/draw` (`roomCode`) |\n| **FR-14** | แสดงหน้า 404 เมื่อเปิดห้องที่ไม่มี | US-14 | `room/[code]/page.tsx` |\n| **FR-15** | แก้ร้าน: ชื่อเล่น ประเภทอาหาร ตัวคูณโอกาส ราคา | US-15 | `api/restaurants/[id]` PATCH |\n| **FR-16** | ปิด / เปิดร้าน และมีรายการ \"ร้านที่ไม่สุ่ม\" | US-16 | PATCH `disabled` |\n| **FR-17** | เพิ่มร้านเอง (ปักหมุดหรือวางพิกัด / ลิงก์ Google Maps) และลบร้านที่เพิ่มเอง | US-17 | `add-restaurant-form.tsx`, `api/restaurants` |\n| **FR-18** | เพิ่ม แก้ชื่อ ลบประเภทอาหาร | US-18 | `category-manager.tsx`, `api/categories` |\n| **FR-19** | หน้าประวัติ: ผลล่าสุด (ใหม่สุดก่อน) พร้อมป้ายสถานะ และแชมป์ 7 วัน | US-19 | `history/page.tsx` |\n| **FR-20** | จำโหวต ตัวกรอง และตัวตนผู้ให้คะแนน ของคนที่ใช้คนเดียวไว้ในเบราว์เซอร์ | US-03, US-05, US-08 | `lunch-app.tsx` (localStorage) |\n| **FR-21** | ล้างข้อมูลเป็นค่าเริ่มต้นด้วย `POST /api/test/reset` เฉพาะโหมดทดสอบ | US-21 | `api/test/reset` |\n| **FR-23** | ค้นหาร้านจากชื่อ ชื่อเล่น ประเภทอาหาร หรือเบอร์ บนกระดานและแผนที่ โดยไม่เปลี่ยนโอกาสหรือผลสุ่ม · บอกจำนวนที่พบ และจำนวนที่ถูกตัวกรองซ่อน | US-23 | `src/lib/search.ts`, `lunch-app.tsx` |\n| **FR-22** | ดึงร้านใหม่จาก OpenStreetMap โดยไม่ทับค่าที่ทีมแก้และไม่เปลี่ยนเลขร้าน | — | `scripts/fetch-osm.ts` |\n\n---\n\n## 3. Business Rules (BR)\n\nส่วนนี้คือ \"เงิน\" ของระบบ ถ้าผิด ผลสุ่มไม่ยุติธรรม ทุกข้อจึงต้องมี test ที่คิดตัวเลขซ้ำ (ดู `04_TEST-DATA.md`)\n\n### 3.1 สูตรโอกาส (`src/lib/odds.ts`)\n\n| ID | กติกา | ค่า |\n|---|---|---|\n| **BR-01** | โอกาสของร้าน = น้ำหนักร้าน ÷ ผลรวมน้ำหนักของทุกร้านที่ผ่านตัวกรอง | ผลรวมทุกร้าน = 100% |\n| **BR-02** | น้ำหนักร้าน = ตัวคูณโอกาส × ตัวคูณแนว × ตัวคูณโหวตร้าน × ตัวคูณกินแล้ว × ตัวคูณระยะ × ตัวคูณคะแนน | 6 ตัวคูณ |\n| **BR-03** | ตัวคูณโหวต (ทั้งแนวและร้าน) = max(0.1, 1 + 0.5 × คะแนนสุทธิ) | +1 → 1.5 · −1 → 0.5 · −2 → 0.1 (ชนพื้น) |\n| **BR-04** | ร้านหลายแนวใช้ตัวคูณของแนวที่ **สูงที่สุด** · ร้านไม่มีแนว = ×1 | |\n| **BR-05** | ตัวคูณโอกาส 0.5–5 ปัดเป็นขั้นละ 0.5 · ค่าเริ่มต้น 1 | 0.74 → 0.5 · 0.75 → 1 |\n| **BR-06** | ตัวคูณกินแล้ว = 0.2 + 0.8 × (วันที่ผ่านไป ÷ 7) · ครบ 7 วัน = 1 · เวลาในอนาคตนับเป็นวันนี้ | วันที่ 0 → 0.2 · วันที่ 3.5 → 0.6 |\n| **BR-07** | ขี้เกียจเดิน: ตัดร้านที่ระยะเดิน > 500 ม. | ≤ 500 อยู่ · 501 หลุด |\n| **BR-08** | ตัวคูณระยะ (เฉพาะขี้เกียจเดิน) = 1 + (1 − ระยะเดิน ÷ 500) | 0 ม. → 2.0 · 250 ม. → 1.5 · 500 ม. → 1.0 |\n| **BR-09** | ไม่รู้ระยะเดินจริง → ระยะเดิน = round(ระยะเส้นตรง × 1.3) | |\n| **BR-10** | ช่วงราคา: 1 = ฿ (≤ 60) · 2 = ฿฿ (60–120) · 3 = ฿฿฿ (120–250) · 4 = ฿฿฿฿ (250+) · 0 = ไม่ระบุ · ไม่เลือก = ไม่กรอง | |\n| **BR-11** | ตัวคูณคะแนน = 0.6 + (เฉลี่ย − 1) ÷ 3 × 0.8 · ยังไม่มีคะแนน = 1 · คะแนนเฉลี่ยปัด 2 ตำแหน่ง | เฉลี่ย 1 → 0.6 · 2.5 → 1.0 · 4 → 1.4 |\n| **BR-12** | ร้านที่ปิด ไม่อยู่ในการคำนวณและไม่ถูกสุ่ม | |\n| **BR-13** | สุ่มด้วย `crypto.getRandomValues` ตามน้ำหนัก (roulette wheel) · ไม่มีร้านเหลือ → 409 | |\n| **BR-14** | การแสดง %: 0 → \"0%\" · < 0.1% → \"<0.1%\" · อื่น ๆ ทศนิยม 1 ตำแหน่ง · เรียงตาม % มาก → น้อย ถ้าเท่ากันเรียงเลขร้าน | 1/237 → \"0.4%\" |\n\n### 3.2 กติกาข้อมูล\n\n| ID | กติกา |\n|---|---|\n| **BR-15** | ลบได้เฉพาะร้านที่เพิ่มเอง (`osmId` ขึ้นต้นด้วย `manual/`) ร้านจาก OSM ลบไม่ได้ → 409 ให้ปิดแทน |\n| **BR-16** | ร้านต้องมีประเภทอาหารอย่างน้อย 1 แนว ทั้งตอนเพิ่มและตอนแก้ |\n| **BR-17** | เพิ่มร้านได้เฉพาะระยะเส้นตรงไม่เกิน 2,000 ม. จากออฟฟิศ (13.7247, 100.5245) |\n| **BR-18** | ร้านที่เพิ่มเองได้เลขถัดจากเลขสูงสุด · เลขร้านไม่ถูกใช้ซ้ำแม้ดึงข้อมูล OSM ใหม่ |\n| **BR-19** | ความยาว: ชื่อร้าน 80 · ชื่อเล่นร้าน 40 · ชื่อประเภทอาหาร 30 · ชื่อเล่นในห้อง 24 · ชื่อผู้ให้คะแนน 24 · เวลาเปิด 80 (เกินตัดทิ้ง ยกเว้นชื่อแนวที่ตอบ 400) |\n| **BR-20** | ชื่อประเภทอาหารห้ามว่างและห้ามซ้ำ (409) · ลบแนวแล้วเอาออกจากทุกร้านและทุกโหวตในห้อง |\n| **BR-21** | 1 เบราว์เซอร์ (`rater` 8–64 ตัว `[A-Za-z0-9_-]`) ให้ได้ร้านละ 1 คะแนน · score 1–4 · 0 = ถอนคะแนน |\n| **BR-22** | รหัสห้อง 4 ตัวจาก `ABCDEFGHJKLMNPQRSTUVWXYZ23456789` (ไม่มี 0 O 1 I) · ไม่สนตัวพิมพ์เล็ก/ใหญ่ |\n| **BR-23** | คนเดียวโหวตได้แนวละ / ร้านละ −1, 0, +1 · ในห้อง คะแนนสุทธิ = ผลรวมของทุกสมาชิก · คนนอกห้องโหวตไม่ได้ (404) |\n| **BR-24** | ห้องที่ไม่มีความเคลื่อนไหว 3 วันถูกลบ · เก็บผลการสุ่ม 1,000 ครั้งล่าสุด |\n| **BR-25** | \"กินไปแล้ว\" นับจากผลการสุ่มที่ยืนยัน (`eatenAt`) ภายใน 7 วัน ใช้ครั้งล่าสุดของแต่ละร้าน |\n| **BR-26** | ป้ายในประวัติ: ยืนยันแล้ว = **ไปกิน** · เป็นผลล่าสุดของห้องนั้น (หรือของการใช้คนเดียว) และสุ่มมาไม่เกิน 2 ชม. = **รอยืนยัน** · นอกนั้น = **ไม่ได้ไปกิน** · แสดง 30 รายการล่าสุด |\n| **BR-27** | แชมป์ 7 วัน = 5 ร้านที่ **ถูกสุ่มได้** บ่อยที่สุดใน 7 วัน (นับทุกผล ไม่ว่าไปกินหรือไม่) |\n| **BR-28** | เวลาเดิน (นาที) = max(1, round(ระยะเดิน ÷ 80)) · คิดความเร็วเดิน 80 ม./นาที |\n\n---\n\n## 4. Non-Functional Requirements (NFR)\n\n| ID | หมวด | ข้อกำหนด | วัดอย่างไร |\n|---|---|---|---|\n| **NFR-01** | ความเร็ว | หน้าแรกพร้อมใช้ (เห็นจำนวนร้าน) ภายใน 2 วินาทีบนเครื่องในออฟฟิศ | Playwright รอ `pool-count` |\n| **NFR-02** | ความเร็ว | API ทั่วไปตอบภายใน 300 ms (ข้อมูล 237 ร้าน) · ตัวคำนวณระยะเดินภายนอกตัดที่ 4 วินาที | วัดเวลา request |\n| **NFR-03** | Realtime | การเปลี่ยนแปลงไปถึงทุกจอในห้องภายใน **3 วินาที** โดยไม่ต้องรีโหลด | TC-ROOM-* |\n| **NFR-04** | ความถูกต้อง | การสุ่มทำที่ server เท่านั้น ห้องใช้ข้อมูลของห้อง ไม่เชื่อค่าจากเบราว์เซอร์ | TC-ROOM-05 |\n| **NFR-05** | ความถูกต้อง | % ที่หน้าจอต้องเท่ากับที่ server ใช้สุ่ม (ใช้ฟังก์ชันเดียวกัน `odds.ts`) | unit test + TC-DRAW-* |\n| **NFR-06** | ความทนทาน | เน็ตหลุดแล้วต่อใหม่ ต้องได้ข้อมูลล่าสุดทันที · โหลดแผนที่พื้นหลังไม่ได้ หมุดยังต้องขึ้น | BUG-02, BUG-03 |\n| **NFR-07** | การเก็บข้อมูล | ไฟล์ JSON ใน `data/` เขียนแบบ atomic (ไฟล์ชั่วคราว + rename) ทีละครั้ง · แก้ไฟล์จากข้างนอกแล้วระบบโหลดใหม่เอง | อ่านโค้ด `store.ts` |\n| **NFR-08** | การติดตั้ง | รันเป็น Node process เดียวค้างไว้ (เครื่องหรือ VPS) · **ไม่รองรับ serverless / Vercel** | README |\n| **NFR-09** | ความปลอดภัย | ไม่มี login (ทีมยอมรับความเสี่ยง) แต่ต้อง: escape ข้อความที่ผู้ใช้พิมพ์ทุกที่ · ตรวจชนิดและขอบเขตทุก input ที่ API · `/api/test/reset` ปิดเมื่อไม่ใช่โหมดทดสอบ | TC-API-*, CH-03 |\n| **NFR-10** | ใช้งานบนมือถือ | จอ 390 px: ปุ่มสุ่มร้านเห็นได้โดยไม่เลื่อน ไม่มี scroll แนวนอน การ์ดผลเลื่อนเข้าจอเอง | TC-MOB-* |\n| **NFR-11** | การเข้าถึง | ใช้คีย์บอร์ดสุ่มร้านและโหวตได้ · ปุ่มไอคอนมีชื่อให้โปรแกรมอ่านจอ · ปิดแอนิเมชันเมื่อผู้ใช้ตั้ง reduced motion | CH-04 |\n| **NFR-12** | ภาษา | ข้อความบนหน้าจอเป็นภาษาไทยทั้งหมด · เวลาเป็นเขต Asia/Bangkok | |\n| **NFR-13** | ค่าใช้จ่าย | ใช้บริการฟรีทั้งหมด ไม่ต้องมี API key (OSM, OSRM, CARTO tiles) | README |\n| **NFR-14** | ทดสอบได้ | โหมดทดสอบ (`LUNCH_TEST=1`) ใช้ข้อมูลแยก (`LUNCH_DATA_DIR`) และไม่เรียกอินเทอร์เน็ต | `playwright.config.ts` |\n\n---\n\n## 5. ตารางโยง Story → Requirement\n\n| Story | FR | BR | NFR |\n|---|---|---|---|\n| US-01 โอกาสของแต่ละร้าน | FR-01 | BR-01, BR-14 | NFR-01, NFR-05 |\n| US-02 สุ่มร้าน | FR-02 | BR-12, BR-13, BR-28 | NFR-04 |\n| US-03 โหวตแนว | FR-03, FR-20 | BR-03, BR-04, BR-23 | |\n| US-04 โหวตร้าน | FR-04 | BR-03, BR-23 | |\n| US-05 ขี้เกียจเดิน | FR-05 | BR-07, BR-08, BR-09 | |\n| US-06 กรองราคา | FR-06 | BR-10 | |\n| US-07 กินแล้ว | FR-07 | BR-06, BR-25 | |\n| US-08 คะแนนแมว | FR-08 | BR-11, BR-21 | |\n| US-09 – US-13 ห้อง | FR-10 – FR-13 | BR-22, BR-23 | NFR-03, NFR-04, NFR-06 |\n| US-14 ห้องไม่มี | FR-14 | BR-24 | |\n| US-15, US-16 แก้ / ปิดร้าน | FR-15, FR-16 | BR-05, BR-12, BR-16, BR-19 | NFR-07, NFR-09 |\n| US-17 เพิ่มร้าน | FR-17 | BR-15 – BR-19 | NFR-02 |\n| US-18 ประเภทอาหาร | FR-18 | BR-19, BR-20 | |\n| US-19 ประวัติ | FR-19 | BR-24 – BR-27 | |\n| US-20 มือถือ | — | — | NFR-10 |\n| US-21 ทดสอบ | FR-21 | — | NFR-14 |\n| US-22 แผนที่ | FR-09 | — | NFR-06 |\n| US-23 ค้นหาร้าน | FR-23 | BR-01 (ไม่เปลี่ยน) | — |\n\n## 6. ข้อที่ยังต้องถามทีม\n\n| # | คำถาม | ทำไมสำคัญ |\n|---|---|---|\n| Q1 | README เขียนสูตรไว้ 5 ตัวคูณ แต่โค้ดมีตัวคูณคะแนนแมวด้วย (BR-11) เอกสารไหนถูก | ผู้ใช้อ่าน README แล้วคิด % เองไม่ตรง |\n| Q2 | เวลาเปิด-ปิดร้าน (`openingHours`) ควรใช้กรองร้านที่ปิดอยู่ไหม | ตอนนี้อาจสุ่มได้ร้านที่ปิดวันนั้น |\n| Q3 | ไม่มี login: ยอมรับได้ไหมถ้ามีคนลบประเภทอาหารหรือปิดทุกร้าน | ไม่มีทางกู้คืนนอกจาก git |\n| Q4 | ลบแนวที่เป็นแนวเดียวของร้าน ร้านนั้นควรเป็นแนวอะไร | BR-16 บอกว่าต้องมีอย่างน้อย 1 แนว |\n| Q5 | แชมป์ 7 วันนับ \"ถูกสุ่มได้\" ไม่ใช่ \"ไปกินจริง\" (BR-27) ตรงกับที่ทีมอยากรู้ไหม | story ถามว่า \"ไปร้านไหนบ่อยสุด\" |\n"}, {"key": "03", "title": "Design", "file": "03_DESIGN.md", "phase": "ฟังร้าน", "md": "# 🏗️ Design — ข้าวไหนดี (lunch-draw)\n\nออกแบบจาก `02_REQUIREMENTS.md` มี 5 แผนภาพ ทุกภาพเขียนด้วย Mermaid (GitHub และ VS Code แสดงผลได้เลย) และแยกเป็นไฟล์ไว้ใน `03_design/` ด้วย\n\n| # | แผนภาพ | ตอบคำถาม | ไฟล์ |\n|---|---|---|---|\n| 1 | Architecture | ระบบมีชิ้นส่วนอะไร คุยกันอย่างไร | `03_design/01-architecture.mmd` |\n| 2 | Use Case | ใครทำอะไรกับระบบได้บ้าง | `03_design/02-use-case.mmd` |\n| 3 | Flowchart | สุ่มร้านหนึ่งครั้ง ระบบคิดอะไรตามลำดับ | `03_design/03-flowchart-draw.mmd` |\n| 4 | ERD | เก็บข้อมูลอะไร เชื่อมกันอย่างไร | `03_design/04-erd.mmd` |\n| 5 | Sequence | ในห้อง โหวตและสุ่มร้านแล้วทุกจอเห็นพร้อมกันได้อย่างไร | `03_design/05-sequence-room.mmd` |\n\n---\n\n## 1. Architecture\n\n```mermaid\nflowchart LR\n  subgraph Browser[\"เบราว์เซอร์ (มือถือ / คอม)\"]\n    UI[\"หน้าเว็บ React<br/>lunch-app · odds-board · odds-map\"]\n    LS[(\"localStorage<br/>โหวต ตัวกรอง rater id\")]\n    ODDS_C[\"odds.ts<br/>คิด % ให้กระดาน\"]\n    UI --- LS\n    UI --- ODDS_C\n  end\n\n  subgraph Server[\"Next.js 16 · Node process เดียว\"]\n    PAGES[\"App Router pages<br/>/ · /room/[code] · /history<br/>/restaurants/new · /categories\"]\n    API[\"Route Handlers /api/*<br/>draw · rooms · restaurants<br/>categories · draws · events\"]\n    ODDS_S[\"odds.ts<br/>คิด % + สุ่ม (crypto)\"]\n    STORE[\"store.ts<br/>ข้อมูลในหน่วยความจำ<br/>+ EventEmitter\"]\n    API --> ODDS_S\n    API --> STORE\n    PAGES --> STORE\n  end\n\n  subgraph Disk[\"data/ (ไฟล์ JSON)\"]\n    R[(\"restaurants.json\")]\n    C[(\"categories.json\")]\n    RT[(\"ratings.json\")]\n    S[(\"state.json<br/>ห้อง โหวต ผลการสุ่ม\")]\n  end\n\n  subgraph External[\"บริการฟรีภายนอก\"]\n    OSM[\"OpenStreetMap<br/>(ดึงร้าน ตอน data:fetch)\"]\n    OSRM[\"routing.openstreetmap.de<br/>ระยะเดินจริง\"]\n    CARTO[\"CARTO tiles<br/>แผนที่พื้นหลัง\"]\n    GMAPS[\"Google Maps<br/>ลิงก์นำทาง\"]\n  end\n\n  UI -- \"fetch JSON\" --> API\n  API -- \"SSE /api/events<br/>room · restaurants · categories\" --> UI\n  STORE -- \"เขียน atomic<br/>tmp + rename\" --> Disk\n  Disk -- \"อ่านตอนเริ่ม / ไฟล์เปลี่ยน\" --> STORE\n  API -. \"เพิ่มร้าน (timeout 4 วิ)\" .-> OSRM\n  UI -. \"tiles\" .-> CARTO\n  UI -. \"ลิงก์\" .-> GMAPS\n  OSM -. \"scripts/fetch-osm.ts\" .-> R\n```\n\n**การตัดสินใจหลัก**\n\n| เรื่อง | เลือก | เหตุผล | แลกกับ |\n|---|---|---|---|\n| ที่เก็บข้อมูล | ไฟล์ JSON ใน `data/` | ไม่ต้องดูแล database · commit ข้อมูลร้านลง git ได้ (NFR-07) | ต้องรันเป็น process เดียว · ไม่รองรับ Vercel |\n| Realtime | Server-Sent Events | ทางเดียวพอ (server → จอ) · ไม่ต้องติดตั้งอะไรเพิ่ม | ต้องต่อค้างไว้ · ส่ง ping ทุก 20 วิ |\n| สูตรโอกาส | ไฟล์เดียว `odds.ts` ใช้ทั้ง client และ server | % ที่เห็นตรงกับที่ใช้สุ่ม (NFR-05) | client ต้องได้ข้อมูลเหมือน server ทุกครั้ง |\n| การสุ่ม | ทำที่ server เท่านั้น | ทุกคนในห้องเห็นผลเดียวกัน (NFR-04) | ต้องมีเน็ตถึง server |\n| ตัวตน | ไม่มี login · ชื่อเล่นในห้อง · `rater` id สุ่มในเบราว์เซอร์ | ทีมไม่อยากสมัคร (สัมภาษณ์ข้อ 10) | ใครก็แก้ข้อมูลได้ (Q3) |\n| แผนที่ | MapLibre + CARTO | ฟรี ไม่ต้องมี key (NFR-13) | ถ้าโหลด tiles ไม่ได้ ต้องยังวางหมุดได้ |\n\n## 2. Use Case\n\n```mermaid\nflowchart LR\n  hungry([\"🍜 คนหิว\"])\n  host([\"👥 คนเปิดห้อง\"])\n  member([\"🙋 สมาชิกห้อง\"])\n  editor([\"🛠️ คนดูแลข้อมูลร้าน\"])\n  tester([\"🧪 ผู้ทดสอบ\"])\n\n  subgraph System[\"ข้าวไหนดี\"]\n    UC1([\"ดูโอกาสของแต่ละร้าน / แผนที่\"])\n    UC2([\"โหวตประเภทอาหาร\"])\n    UC3([\"โหวตร้าน\"])\n    UC4([\"ตั้งตัวกรอง<br/>ขี้เกียจเดิน · ราคา\"])\n    UC5([\"สุ่มร้าน\"])\n    UC6([\"บันทึกว่าไปกินแล้ว\"])\n    UC7([\"ให้คะแนนร้าน\"])\n    UC8([\"ดูประวัติ / แชมป์\"])\n    UC9([\"สร้างห้อง\"])\n    UC10([\"เข้าห้องด้วยชื่อเล่น\"])\n    UC11([\"แก้ข้อมูลร้าน / ปิดร้าน\"])\n    UC12([\"เพิ่ม / ลบร้านเอง\"])\n    UC13([\"จัดการประเภทอาหาร\"])\n    UC14([\"ล้างข้อมูลทดสอบ\"])\n  end\n\n  hungry --> UC1 & UC2 & UC3 & UC4 & UC5 & UC6 & UC7 & UC8\n  host --> UC9\n  host --> UC10\n  member --> UC10\n  member --> UC2 & UC3 & UC4 & UC5\n  editor --> UC11 & UC12 & UC13\n  tester --> UC14\n\n  UC5 -. \"include\" .-> UC1\n  UC6 -. \"extend\" .-> UC5\n  UC7 -. \"extend\" .-> UC5\n  UC9 -. \"include\" .-> UC10\n```\n\n> คนเปิดห้องก็คือสมาชิกคนแรก ทุกคนในห้องมีสิทธิ์เท่ากัน (ใครกดสุ่มร้านก็ได้) และทุกคนเป็น \"คนดูแลข้อมูลร้าน\" ได้เพราะไม่มี login\n\n## 3. Flowchart — สุ่มร้านหนึ่งครั้ง (`POST /api/draw`)\n\n```mermaid\nflowchart TD\n  A([กด สุ่มร้าน]) --> B{มี roomCode?}\n  B -- มี --> C{ห้องมีอยู่?}\n  C -- ไม่มี --> X1[/404 room not found/]\n  C -- มี --> D[ใช้ตัวกรอง โหวตแนว โหวตร้าน<br/>ของห้อง]\n  B -- ไม่มี --> E[ใช้ค่าจากเบราว์เซอร์<br/>บีบโหวตให้อยู่ใน -1 ถึง +1]\n  D --> F[โหลดร้านทั้งหมด + กินล่าสุดใน 7 วัน<br/>+ คะแนนเฉลี่ย]\n  E --> F\n  F --> G[/ตัดร้านที่: ปิด · เดินเกิน 500 ม. ถ้าขี้เกียจเดิน<br/>· ราคาไม่อยู่ในช่วงที่เลือก/]\n  G --> H[คิดน้ำหนักทีละร้าน<br/>ฐาน × แนว × ร้าน × กินแล้ว × ระยะ × คะแนน]\n  H --> I[โอกาส = น้ำหนัก ÷ ผลรวม]\n  I --> J{เหลือร้านน้ำหนัก > 0?}\n  J -- ไม่ --> X2[/409 ไม่มีร้านให้สุ่ม/]\n  J -- ใช่ --> K[สุ่มเลข crypto 0–1<br/>× ผลรวม แล้วไล่ลบทีละร้าน]\n  K --> L[บันทึก Draw ลง state.json<br/>เก็บ 1,000 ครั้งล่าสุด]\n  L --> M{เป็นห้อง?}\n  M -- ใช่ --> N[ส่ง event room ให้ทุกจอในห้อง]\n  M -- ไม่ --> O\n  N --> O[/201 + ร้าน + โอกาส/]\n  O --> P([การ์ดผล: ชื่อ ระยะ เวลาเดิน<br/>Google Maps · ไปกินร้านนี้ · ให้คะแนน])\n```\n\n## 4. ERD — ข้อมูลในไฟล์ JSON\n\n```mermaid\nerDiagram\n  RESTAURANT {\n    int number PK \"เลขร้าน / id\"\n    string osmId \"node/… หรือ manual/…\"\n    string name\n    string nameEn\n    float lat\n    float lon\n    int distance \"ม. เส้นตรงจากออฟฟิศ\"\n    int walkDistance \"ม. เดินจริง (null ได้)\"\n    string openingHours\n    string_array categories FK\n    float baseWeight \"0.5–5 ค่าเริ่ม 1\"\n    string nickname \"≤40\"\n    int priceLevel \"1–4 หรือ null\"\n    bool disabled\n  }\n  CATEGORY {\n    string id PK \"noodle · c-xxxxxxxx\"\n    string label \"≤30 ห้ามซ้ำ\"\n  }\n  RATING {\n    int restaurantId FK\n    string rater PK \"id สุ่มในเบราว์เซอร์\"\n    int score \"1–4\"\n    string name \"ชื่อเล่น ≤24\"\n    datetime at\n  }\n  ROOM {\n    string code PK \"4 ตัว\"\n    bool lazyMode\n    int_array prices\n    datetime createdAt\n    datetime updatedAt \"ไม่ขยับ 3 วัน = ลบ\"\n  }\n  MEMBER {\n    string id PK\n    string nickname \"≤24 ซ้ำในห้อง = คนเดิม\"\n    datetime createdAt\n  }\n  VOTE {\n    string memberId FK\n    string categoryId FK\n    int value \"-1 หรือ +1\"\n  }\n  RESTAURANT_VOTE {\n    string memberId FK\n    int restaurantId FK\n    int value \"-1 หรือ +1\"\n  }\n  DRAW {\n    string id PK\n    string roomCode FK \"null = คนเดียว\"\n    int restaurantId FK\n    float probability\n    bool lazyMode\n    datetime createdAt\n    datetime eatenAt \"null = ยังไม่ยืนยัน\"\n  }\n\n  CATEGORY ||--o{ RESTAURANT : \"จัดแนว (หลายต่อหลาย ผ่าน categories[])\"\n  RESTAURANT ||--o{ RATING : \"ได้คะแนน\"\n  ROOM ||--o{ MEMBER : \"มีสมาชิก\"\n  ROOM ||--o{ VOTE : \"เก็บโหวตแนว\"\n  ROOM ||--o{ RESTAURANT_VOTE : \"เก็บโหวตร้าน\"\n  MEMBER ||--o{ VOTE : \"โหวต\"\n  MEMBER ||--o{ RESTAURANT_VOTE : \"โหวต\"\n  CATEGORY ||--o{ VOTE : \"ถูกโหวต\"\n  RESTAURANT ||--o{ RESTAURANT_VOTE : \"ถูกโหวต\"\n  RESTAURANT ||--o{ DRAW : \"ถูกสุ่มได้\"\n  ROOM |o--o{ DRAW : \"สุ่มในห้อง\"\n```\n\n| ไฟล์ | Entity | อยู่ใน git |\n|---|---|---|\n| `data/restaurants.json` | RESTAURANT | ✅ |\n| `data/categories.json` | CATEGORY | ✅ |\n| `data/ratings.json` | RATING | ✅ |\n| `data/state.json` | ROOM (+ MEMBER, VOTE, RESTAURANT_VOTE ฝังใน room) · DRAW | ❌ gitignore |\n\nข้อมูลที่ **คำนวณ ไม่ได้เก็บ**: `lastEatenAt` (จาก DRAW), `ratingAvg` / `ratingCount` (จาก RATING), `manual` (จาก `osmId`), จำนวนร้านต่อแนว, คะแนนสุทธิของห้อง\n\n## 5. Sequence — ห้อง: เข้าห้อง โหวต สุ่มร้าน\n\n```mermaid\nsequenceDiagram\n  autonumber\n  actor Ton as ต้น (เปิดห้อง)\n  actor Mew as มิว\n  participant API as Next.js API\n  participant Store as store.ts (+EventEmitter)\n  participant Disk as state.json\n\n  Ton->>API: POST /api/rooms {lazyMode, prices}\n  API->>Store: createRoom(code)\n  Store->>Disk: เขียน atomic\n  API-->>Ton: 201 {code: \"K7PQ\"}\n  Ton->>API: POST /api/rooms/K7PQ/members {nickname:\"ต้น\"}\n  API-->>Ton: 201 {id: m1}\n  Ton->>API: GET /api/events?room=K7PQ (SSE ค้างไว้)\n  API-->>Ton: event restaurants + event room (สถานะปัจจุบัน)\n\n  Mew->>API: เปิดลิงก์ /room/K7PQ → POST members {nickname:\"มิว\"}\n  API->>Store: updateRoom → emit room\n  Store-->>API: change\n  API-->>Ton: event room (2 คนในห้อง)\n  Mew->>API: GET /api/events?room=K7PQ\n  API-->>Mew: event restaurants + event room\n\n  par โหวตพร้อมกัน\n    Ton->>API: PUT votes {m1, isan, +1}\n  and\n    Mew->>API: PUT votes {m2, isan, +1}\n  end\n  API->>Store: updateRoom ×2 → persist ทีละครั้ง\n  API-->>Ton: event room (isan +2 ×2.0)\n  API-->>Mew: event room (isan +2 ×2.0)\n\n  Ton->>API: POST /api/draw {roomCode:\"K7PQ\"}\n  API->>Store: roomState → computeOdds → pick(crypto)\n  Store->>Disk: บันทึก Draw\n  API-->>Ton: 201 {restaurantId: 46, probability}\n  API-->>Mew: event room (latestDraw = 46)\n  Note over Ton,Mew: ทั้งสองจอแสดงการ์ดผลร้าน #46 ภายใน 3 วินาที (NFR-03)\n\n  Mew->>API: PATCH /api/draws/{id} {eaten:true}\n  API->>Store: setEaten → emit restaurants\n  API-->>Ton: event restaurants (ร้าน #46 ×0.2)\n  API-->>Mew: event restaurants\n```\n\n---\n\n## 6. หน้าจอและ API\n\n| หน้า | ใช้ทำอะไร | API ที่เรียก |\n|---|---|---|\n| `/` | สุ่มคนเดียว: กระดาน / แผนที่ โหวต ตัวกรอง สุ่มร้าน | `GET /api/restaurants`, `POST /api/draw`, `PATCH /api/draws/:id`, `PUT …/rating`, `PATCH /api/restaurants/:id`, SSE |\n| `/room/[code]` | เหมือนหน้าแรก แต่โหวตและตัวกรองเป็นของห้อง | `+ /api/rooms/:code`, `…/members`, `…/votes`, SSE `?room=` |\n| `/history` | ผลล่าสุด 30 รายการ + แชมป์ 7 วัน | อ่านจาก store ตอน render |\n| `/restaurants/new` | เพิ่มร้านเอง | `POST /api/restaurants` |\n| `/categories` | จัดการประเภทอาหาร | `/api/categories`, `/api/categories/:id` |\n\n| Method | Path | สำเร็จ | ผิดพลาด |\n|---|---|---|---|\n| GET | `/api/restaurants` | 200 `{restaurants, categories}` | |\n| POST | `/api/restaurants` | 201 `{number, distance, walkDistance}` | 400 |\n| PATCH / DELETE | `/api/restaurants/:id` | 200 `{ok}` | 400 · 404 · 409 (ลบร้าน OSM) |\n| PUT | `/api/restaurants/:id/rating` | 200 `{ok}` | 400 · 404 |\n| GET / POST | `/api/categories` | 200 / 201 | 400 · 409 |\n| PATCH / DELETE | `/api/categories/:id` | 200 | 400 · 404 · 409 |\n| POST | `/api/draw` | 201 `{id, restaurantId, probability, …}` | 404 (ห้อง) · 409 (ไม่มีร้าน) |\n| PATCH | `/api/draws/:id` | 200 | 400 · 404 |\n| POST | `/api/rooms` | 201 `{code}` | |\n| GET / PATCH | `/api/rooms/:code` | 200 room state | 400 · 404 |\n| POST | `/api/rooms/:code/members` | 201 `{id, nickname}` | 400 · 404 |\n| PUT | `/api/rooms/:code/votes` | 200 room state | 400 · 404 |\n| GET | `/api/events[?room=]` | 200 `text/event-stream` | |\n| POST | `/api/test/reset` | 200 `{restaurants}` | 404 ถ้าไม่ใช่ `LUNCH_TEST=1` |\n"}, {"key": "04", "title": "Test Data", "file": "04_TEST-DATA.md", "phase": "ฟังร้าน", "md": "# 🧪 Test Data — ข้าวไหนดี (lunch-draw)\n\nข้อมูลที่ใช้ทดสอบ และตัวเลขที่ \"คิดซ้ำ\" ไว้ล่วงหน้า เพื่อให้ผู้ทดสอบรู้ผลที่ถูกต้องก่อนเปิดเว็บ\n\n> **คิดเงินซ้ำ (double calculation)** ระบบนี้ไม่มีเงิน แต่ \"เงิน\" ของมันคือ **% โอกาส** ถ้าผิด การสุ่มไม่ยุติธรรม\n> เราจึงเขียนสูตรใหม่อีกชุดจาก `02_REQUIREMENTS.md` โดยไม่ดูโค้ดแอป (`04_test-data/recompute-odds.ts`) แล้วเทียบกับโค้ดจริง `src/lib/odds.ts` ทุกร้าน ทุกสถานการณ์\n\n---\n\n## 1. ข้อมูลตั้งต้น\n\n| ข้อมูล | ที่อยู่ | ค่า |\n|---|---|---|\n| ร้าน (แช่แข็งไว้สำหรับเทสต์) | `e2e/data/restaurants.json` | **237 ร้าน** เลข #1–#237 ยังไม่มีราคา ชื่อเล่น น้ำหนัก หรือร้านที่ปิด |\n| ประเภทอาหาร | `e2e/data/categories.json` | **16 แนว** |\n| ห้อง / โหวต / ผลการสุ่ม / คะแนน | สร้างใหม่ทุกเทสต์ | ว่าง |\n| ออฟฟิศ | `src/lib/geo.ts` | 13.7247, 100.5245 (อาคารจันวาณิชย์ สีลม) |\n| ล้างข้อมูล | `POST /api/test/reset` | ต้องรันด้วย `LUNCH_TEST=1` และ `LUNCH_DATA_DIR=e2e/.data` |\n\nเซิร์ฟเวอร์ทดสอบคัดลอก `e2e/data` ไปที่ `e2e/.data` ก่อนเริ่ม (`e2e/prepare-data.mjs`) ข้อมูลจริงใน `data/` จึงไม่ถูกแตะ\n\n### 1.1 ตัวเลขสำคัญของข้อมูลตั้งต้น\n\n| สิ่งที่นับ | ค่า | ใช้ใน |\n|---|---|---|\n| ร้านทั้งหมด | 237 | TC-HOME-01 |\n| ร้านที่เดิน ≤ 500 ม. | **49** | TC-FLT-01, TC-ROOM-04 |\n| ร้านที่ไม่มีระยะเดินจริง (ต้องใช้ × 1.3) | 0 | ⚠️ ข้อมูลชุดนี้ทดสอบ BR-09 ไม่ได้ |\n| ร้านที่ใกล้สุด | #1 เดิน 164 ม. · #2 170 ม. · #7 200 ม. | TC-FLT-06 |\n| ร้านขอบ 500 ม. ด้านใน | #84 499 ม. · #43 497 ม. · #20 495 ม. | Boundary |\n| ร้านขอบ 500 ม. ด้านนอก | #92 501 ม. · #40 503 ม. · #14 505 ม. · #42 508 ม. | Boundary |\n| ร้านที่ไกลสุด | 1,578 ม. | |\n| ร้านที่เป็นทั้งเส้นและส้มตำ | **#222** ร้านเดียว | TC-VOTE-05 |\n| ร้านอาหารตะวันตก (ทั้งหมด / อาหารตะวันตกอย่างเดียว) | 26 / **18** | TC-VOTE-02 |\n\n### 1.2 จำนวนร้านต่อแนว\n\n| แนว | id | ร้าน | | แนว | id | ร้าน |\n|---|---|---|---|---|---|---|\n| อาหารไทย | `thai` | 108 | | อาหารอินเดีย | `indian` | 11 |\n| ก๋วยเตี๋ยว / เมนูเส้น | `noodle` | 37 | | อาหารจีน | `chinese` | 11 |\n| อาหารตะวันตก | `western` | 26 | | ข้าวแกง | `rice-curry` | 9 |\n| อาหารตามสั่ง | `made-to-order` | 17 | | อาหารอีสาน | `isan` | 8 |\n| ฟาสต์ฟู้ด | `fast-food` | 14 | | อาหารฮาลาล | `halal` | 6 |\n| อาหารญี่ปุ่น | `japanese` | 14 | | อาหารเอเชียอื่นๆ | `asian` | 6 |\n| ข้าวจานเดียว | `one-dish` | 5 | | มังสวิรัติ / อาหารเจ | `vegetarian` | 4 |\n| อาหารปักษ์ใต้ | `southern` | 2 | | อาหารเกาหลี | `korean` | **0** |\n\n> แนว \"อาหารเกาหลี\" มี 0 ร้าน เหมาะใช้ทดสอบว่าโหวตแนวที่ไม่มีร้านแล้ว % ไม่เปลี่ยน\n\n### 1.3 ร้านที่เทสต์ใช้บ่อย\n\n| เลข | ชื่อ | เดิน (ม.) | แนว | ใช้ใน |\n|---|---|---|---|---|\n| #1 | ครัวอร๊อย-อร่อย | 164 | ข้าวแกง, ไทย, ตามสั่ง | ชื่อเล่น ปิดร้าน ราคา ฿ กินแล้ว คะแนน |\n| #2 | ร้านขนมสาธุและดอกไม้พี่หนิง | 170 | ฟาสต์ฟู้ด | ตัวคูณ ×2 ราคา ฿฿ |\n| #3 | Mama Mia Bangkok | 425 | ไทย | แก้แนวเป็นอาหารญี่ปุ่น · จุดที่มี 6 ร้านซ้อนกันบนแผนที่ |\n| #4 | Kuey chap | 431 | เส้น | ตั้งราคา ฿฿ · โหวตร้าน |\n| #222 | (ร้านเส้น + ส้มตำ) | — | เส้น, ส้มตำ | ตัวคูณแนวที่ดีที่สุด |\n\n---\n\n## 2. ข้อมูลอินพุตสำหรับแต่ละเทคนิค\n\n### 2.1 Boundary (ค่าขอบ)\n\n| ช่อง | ต่ำกว่าขอบ ❌ | ขอบล่าง ✅ | ขอบบน ✅ | เกินขอบ ❌ | กติกา |\n|---|---|---|---|---|---|\n| ระยะเดิน (ขี้เกียจเดิน) | — | — | 500 (มีร้าน 499) | 501 (#92) | BR-07 |\n| ตัวคูณโอกาส | 0.49 → 400 | 0.5 | 5 | 5.01 → 400 | BR-05 |\n| น้ำหนักปัดขั้น | 0.74 → 0.5 | 0.75 → 1 | 4.74 → 4.5 | 4.75 → 5 | BR-05 |\n| ระยะเพิ่มร้าน (เส้นตรง) | — | — | 2,000 ม. | 2,001 ม. → 400 | BR-17 |\n| ชื่อร้าน | ว่าง → 400 | 1 ตัว | 80 ตัว | 81 ตัว → ตัดเหลือ 80 | BR-19 |\n| ชื่อเล่นร้าน | ว่าง → กลับเป็นชื่อจริง | 1 | 40 | 41 → ตัด | BR-19 |\n| ชื่อประเภทอาหาร | ว่าง → 400 | 1 | 30 | 31 → 400 | BR-19 |\n| ชื่อเล่นในห้อง | ว่าง/ช่องว่าง → 400 | 1 | 24 | 25 → ตัด | BR-19 |\n| คะแนนแมว | −1 → 400 | 0 (ถอน) | 4 | 5 → 400 | BR-21 |\n| `rater` | 7 ตัว → 400 | 8 | 64 | 65 → 400 | BR-21 |\n| โหวต | −2 → 400 | −1 | +1 | +2 → 400 | BR-23 |\n| ราคา | 0 = ไม่ระบุ (ใช้กรองได้) | 1 | 4 | 5 → 400 | BR-10 |\n| กินแล้ว (วัน) | อนาคต → นับเป็น 0 | 0 → ×0.2 | 6.99 → ×0.999 | 7 → ×1 | BR-06 |\n\n### 2.2 ค่าผิดรูปแบบ (Negative)\n\n| API | ส่ง | คาดหวัง |\n|---|---|---|\n| `PUT /api/rooms/:code/votes` | `categoryId: \"pizza\"` · `value: 5` · `memberId` คนนอกห้อง | 400 · 400 · 404 |\n| `PATCH /api/restaurants/1` | `baseWeight: 9` / `0` · `priceLevel: 7` · `categories: []` · `categories: [\"x\"]` · `disabled: \"yes\"` | 400 ทุกกรณี |\n| `PATCH /api/restaurants/99999` | ค่าใด ๆ | 404 |\n| `DELETE /api/restaurants/1` | ร้านจาก OSM | 409 |\n| `POST /api/draw` | `{prices:[1]}` ตอนไม่มีร้านไหนมีราคา | 409 \"ไม่มีร้านให้สุ่ม…\" |\n| `POST /api/categories` | `label` ซ้ำ \"อาหารญี่ปุ่น\" | 409 \"มีประเภทอาหารนี้อยู่แล้ว\" |\n| `GET /api/rooms/ZZZZ` | ห้องที่ไม่มี | 404 |\n| `POST /api/test/reset` | เซิร์ฟเวอร์ไม่ได้เปิด `LUNCH_TEST=1` | 404 |\n\n### 2.3 ข้อความแปลก (สำหรับสำรวจ / XSS)\n\n| ใช้กับ | ค่า |\n|---|---|\n| ชื่อร้าน ชื่อเล่น ชื่อแนว | `<script>alert(1)<\/script>` · `<img src=x onerror=alert(1)>` · `\"; DROP TABLE` · `🍜🍜🍜` · `ก๋วยเตี๋ยวเรือ​` (มี zero-width space) · ช่องว่างล้วน |\n| ลิงก์ Google Maps (เพิ่มร้าน) | `13.7243, 100.5251` · `https://www.google.com/maps/@13.7243,100.5251,17z` · `https://maps.google.com/?q=13.7243,100.5251` · `…!3d13.7243!4d100.5251` · ลิงก์ย่อ `maps.app.goo.gl/…` (อ่านไม่ได้ ต้องแจ้ง) |\n| รหัสห้อง | `k7pq` (ตัวเล็ก) · ` K7PQ ` (มีช่องว่าง) · `K7P0` (มีเลข 0) |\n\n### 2.4 ผู้ใช้ในเทสต์ห้อง\n\n| ชื่อ | บทบาท | ใช้ใน |\n|---|---|---|\n| ต้น | คนเปิดห้อง | TC-ROOM-01 ถึง 09 |\n| มิว | สมาชิกคนที่สอง (อีกเบราว์เซอร์) | TC-ROOM-02 ถึง 06 |\n\n---\n\n## 3. คิดซ้ำ: ผลที่ถูกต้องของแต่ละสถานการณ์\n\nรัน:\n\n```bash\nnpx tsx 04_test-data/recompute-odds.ts\n```\n\nผลรันจริง (2026-11-06): **ผ่าน 21 / 21 สถานการณ์** และสุ่มเพิ่ม 500 สถานการณ์ **ไม่ตรง 0 ครั้ง** สูตรในแอปตรงกับ requirement ทุกตัวคูณ\n\n| # | สถานการณ์ | คิดด้วยมือ | ผล | หน้าจอ | Test |\n|---|---|---|---|---|---|\n| S01 | ไม่มีโหวต | 1 ÷ 237 | 0.4219% | 0.4% | TC-HOME-03 |\n| S02 | ก๋วยเตี๋ยว +1 → ร้านเส้น | 1.5 ÷ (37 × 1.5 + 200) = 1.5 ÷ 255.5 | 0.5871% | 0.6% | TC-VOTE-01 |\n| S02 | … ร้านอื่น (#1) | 1 ÷ 255.5 | 0.3914% | 0.4% | |\n| S03 | อาหารตะวันตก −1 → ร้านอาหารตะวันตกอย่างเดียว | 0.5 ÷ (237 − 18 × 0.5) = 0.5 ÷ 228 | 0.2193% | 0.2% | TC-VOTE-02 |\n| S04 | เส้น −1 ส้มตำ +1 → #222 | 1.5 ÷ 225.5 (แนวที่ดีที่สุด ไม่ใช่ ×0.5) | 0.6652% | 0.7% | TC-VOTE-05 |\n| S05 | ห้อง: ส้มตำ +2 → #222 | ×2.0 | 0.8163% | 0.8% | TC-ROOM-03 |\n| S06 | ห้อง: เส้น −3 → 1 + 0.5 × (−3) = −0.5 → ชนพื้น 0.1 | | 0.0478% | <0.1% | |\n| S07 | โหวตร้าน #4 +1 | 1.5 ÷ 237.5 | 0.6316% | 0.6% | TC-VOTE-06 |\n| S08 | ขี้เกียจเดิน → #1 (164 ม.) | (2 − 164/500) = 1.672 ÷ ผลรวม 49 ร้าน 61.01 | 2.7404% | 2.7% | TC-FLT-06 |\n| S08 | … #84 (499 ม.) | 1.002 ÷ 61.01 | 1.6423% | 1.6% | |\n| S09 | กิน #1 วันนี้ | 0.2 ÷ 236.2 | 0.0847% | **<0.1%** | TC-DRAW-04 |\n| S10 | กิน #1 เมื่อ 3.5 วันก่อน | 0.6 ÷ 236.6 | 0.2536% | 0.3% | |\n| S11 | กิน #1 ครบ 7 วัน | กลับเป็น 1 | 0.4219% | 0.4% | |\n| S12 | เวลากินอยู่ในอนาคต | นับเป็นวันนี้ ×0.2 | 0.0847% | <0.1% | BUG-01 |\n| S13 | น้ำหนัก #2 ×2 | 2 ÷ 238 | 0.8403% | 0.8% | TC-EDIT-06 |\n| S14 | กรอง ฿ (#1 = ฿) | 1 ÷ 1 | 100% | 100.0% | TC-FLT-03 |\n| S15 | กรอง ฿ + ฿฿ | 1 ÷ 2 | 50% | 50.0% | TC-FLT-03 |\n| S16 | กรอง \"ไม่ระบุ\" (#1 มีราคา) | 236 ร้าน · 1 ÷ 236 | 0.4237% | 0.4% | TC-FLT-04 |\n| S17 | คะแนนเฉลี่ย 4 ที่ #1 | 1.4 ÷ 237.4 | 0.5897% | 0.6% | TC-RATE-04 |\n| S18 | คะแนนเฉลี่ย 1 ที่ #1 | 0.6 ÷ 236.6 | 0.2536% | 0.3% | |\n| S19 | ปิด #1 | 236 ร้าน | 0.4237% | 0.4% | TC-EDIT-03 |\n| S20 | ผสม: ขี้เกียจเดิน + เส้น +2 + ไทย −1 + #4 (+1, ×1.5, คะแนน 2.5, กิน 3.5 วัน) + #1 (−1, คะแนน 4) | ดูสคริปต์ | #4 5.1801% · #1 1.9732% · #5 3.7831% | 5.2% · 2.0% · 3.8% | |\n| S21 | กรอง ฿฿฿฿ (ไม่มีร้าน) | 0 ร้าน | — | ข้อความ \"ไม่มีร้าน…\" | TC-FLT-02 |\n\n**ข้อสังเกตจากการคิดซ้ำ**\n\n1. **S09 ตรงกับสูตร แต่บนจอแสดง \"<0.1%\"** ผู้ทดสอบที่คาดว่าจะเห็นตัวเลข 0.08% ต้องรู้ไว้ก่อน (BR-14)\n2. ข้อมูลชุดนี้ไม่มีร้านที่ `walkDistance = null` เลย สูตร × 1.3 (BR-09) จึงต้องทดสอบด้วย unit test หรือแก้ข้อมูลใน `e2e/.data`\n3. ตัวคูณคะแนนแมว (BR-11) มีในโค้ดแต่ **ไม่มีในสูตรของ README** (คำถาม Q1 ใน `02_REQUIREMENTS.md`)\n\n---\n\n## 4. การสุ่ม: ตรวจว่าผลจริงตรงกับ %\n\nการคิด % ให้ถูกยังไม่พอ ต้องตรวจว่าสุ่มจริงแล้วออกตาม % ด้วย\n\n| วิธี | ตั้งค่า | คาดหวัง |\n|---|---|---|\n| สุ่มซ้ำผ่าน API | `POST /api/draw {lazy:true}` × 25 | ทุกร้านที่ได้เดิน ≤ 500 ม. (TC-DRAW-02) |\n| เหลือร้านเดียว | ปิดทุกร้านในระยะ 500 ม. ยกเว้น 1 ร้าน แ state.json\nscripts/fetch-osm.ts       ← ดึงร้านจาก OSM ในรัศมี 1 กม. + ระยะเดินจาก OSRM (FR-22)\nsrc/lib/odds.ts            ← สูตรโอกาสทั้งหมด pure function ใช้ทั้ง client และ server\nsrc/lib/store.ts           ← อ่าน/เขียนไฟล์ + EventEmitter สำหรับ SSE\nsrc/lib/geo.ts             ← OFFICE, haversine, parseLatLon, ลิงก์ Google Maps\nsrc/app/**                 ← \"web/\": หน้าเว็บ 5 หน้า + API ตามตารางใน 03_DESIGN.md §6\ne2e/                       ← Playwright: data/ แช่แข็ง, fixtures, tests, report\n```\n\n## ลำดับการทำ (ทำทีละขั้น ตรวจก่อนไปต่อ)\n1. **สูตร** `src/lib/odds.ts` + `odds.test.ts`\n   ทุก BR-01 ถึง BR-14 ต้องมี unit test · รัน `npx tsx 04_test-data/recompute-odds.ts` ต้องผ่าน 21/21 และสุ่ม 500 ครั้งไม่ตรง 0\n2. **ข้อมูล** `store.ts` + `scripts/fetch-osm.ts` → ได้ `data/restaurants.json` ~237 ร้าน\n3. **API** ทุก endpoint ใน 03_DESIGN.md §6 ตรวจ input ตาม BR-15 ถึง BR-23 และตอบ status ตามตาราง\n4. **หน้าแรก** โอกาสของแต่ละร้าน โหวต ตัวกรอง สุ่มร้าน การ์ดผล (US-01 ถึง US-08)\n5. **ห้อง + realtime** (US-09 ถึง US-14) ทุกการเปลี่ยนแปลงต้องถึงอีกจอภายใน 3 วินาที\n6. **แก้ / เพิ่มร้าน / ประเภทอาหาร / ประวัติ / แผนที่** (US-15 ถึง US-19, US-22)\n7. **มือถือ + การเข้าถึง** (US-20, NFR-10, NFR-11)\n8. **โหมดทดสอบ** `LUNCH_TEST=1` + `LUNCH_DATA_DIR` + `POST /api/test/reset` (US-21)\n\n## กติกาการเขียนโค้ด\n- ข้อความบนจอเป็นภาษาไทยทั้งหมด ตรงตามที่เขียนใน story (เทสต์จะหาข้อความเหล่านั้น)\n- ใส่ `data-testid` ให้ส่วนที่เทสต์ต้องอ่าน อย่างน้อย: `pool-count`, `odds-row` (+ `data-number`), `odds-p`\n- client ห้ามคิดสูตรเอง ต้อง import จาก `odds.ts` (NFR-05) · การสุ่มทำที่ server เท่านั้น (NFR-04)\n- ห้าม `dangerouslySetInnerHTML` กับข้อความที่ผู้ใช้พิมพ์ (NFR-09)\n- ทุก API ตรวจชนิดข้อมูลก่อนใช้ ค่าผิดตอบ 400 พร้อม `{ error }` ที่อ่านรู้เรื่อง\n- ปิดแอนิเมชันเมื่อผู้ใช้ตั้ง `prefers-reduced-motion`\n\n## ส่งงานเมื่อ\n- [ ] `npm run typecheck` · `npm run lint` · `npm test` ผ่านทั้งหมด\n- [ ] `npx tsx 04_test-data/recompute-odds.ts` ผ่าน\n- [ ] เปิด `npm run dev` แล้ว | `src/lib/store.ts`, `src/app/api/events/route.ts` | US-11 ถึง US-13 |\n| API 13 ไฟล์ route | `src/app/api/**/route.ts` | ทุก story |\n| หน้าแรก / ห้อง | `src/components/lunch-app.tsx`, `odds-board.tsx`, `odds-map.tsx`, `category-votes.tsx`, `price-filter.tsx`, `vote-control.tsx`, `rating.tsx` | US-01 ถึง US-13, US-22 |\n| แก้ข้อมูล | `add-restaurant-form.tsx`, `location-picker.tsx`, `category-manager.tsx` | US-15 ถึง US-18 |\n| ประวัติ | `src/app/history/page.tsx` | US-19 |\n| ข้อมูลร้าน | `data/restaurants.json` (237 ร้าน), `scripts/fetch-osm.ts` | FR-22 |\n| e2e | `e2e/tests/*.spec.ts` (12 ไฟล์, 79 test case) | ทุก story |\n\nขนาดโค้ด: ราว 4,200 บรรทัด TypeScript ใน `src/`\n\n## 3. ตรวจตามเงื่อนไข \"ส่งงานเมื่อ\" ใน 05_BUILD-PROMPT\n\nตรวจเมื่อ 2026-11-06 14:31\n\n| เงื่อนไข | ผล |\n|---|---|\n| `npm run typecheck` | ✅ ผ่าน ไม่มี error |\n| `npm run lint` | ✅ ผ่าน ไม่มี warning |\n| `npm test` (Vitest) | ✅ 24 / 24 ผ่าน (2 ไฟล์: `odds.test.ts`, `geo.test.ts`) |\n| `npx tsx 04_test-data/recompute-odds.ts` | ✅ 21 / 21 สถานการณ์ + สุ่ม 500 แบบ ตรงกันทั้งหมด |\n| ทำตาม story ด้วยมือ | ➡️ ทำในขั้นสำรวจ `07`–`09` |\n| README | ✅ มีวิธีรัน สูตร ไฟล์ข้อมูล ข้อจำกัด Vercel · ⚠️ สูตรขาดตัวคูณคะแนนแมว (Q1) |\n\n## 4. สิ่งที่ต่างจากเอกสาร\n\n| เรื่อง | เอกสาร | ที่สร้างจริง | สถานะ |\n|---|---|---|---|\n| สูตรใน README | — | ไม่มีตัวคูณคะแนนแมว แต่โค้ดมี | เอกสารต้องแก้ (Q1) |\n| `db/` `web/` | ชื่อโฟลเดอร์ในรายการขั้นตอน | `data/` และ `src/` | ตั้งใจ (ตามมาตรฐาน Next.js) |\n| ร้านที่ไม่มีระยะเดิน | BR-09 | โค้ดรองรับ แต่ข้อมูลทดสอบไม่มีร้านแบบนี้ | ทดสอบด้วย unit test เท่านั้น |\n\n## 5. วิธีรัน\n\n```bash\nnpm install\nnpm run dev            # http://localhost:3000 ใช้ data/ จริง\nnpm test               # unit test สูตร\nnpm run e2e:all        # e2e ทั้งหมด + GIF + Excel (ใช้พอร์ต 3200 และ e2e/.data)\n```\n"}, {"key": "07", "title": "Charters", "file": "07_CHARTERS.md", "phase": "สำรวจ", "md": "# 🧭 Exploratory Test Charters — ข้าวไหนดี (lunch-draw)\n\nขั้นนี้ไม่ได้เขียน test case แต่กำหนด **ภารกิจสำรวจ (charter)** ให้ผู้สำรวจแต่ละคนออกไปหาสิ่งที่ test case 79 ข้อยังไม่ได้คิดถึง แล้วจดผลลง `08_exploration/`\n\nรูปแบบ charter: **สำรวจ** _อะไร_ **ด้วย** _เครื่องมือหรือข้อมูลอะไร_ **เพื่อค้นหา** _ข้อมูลหรือความเสี่ยงอะไร_\n\n---\n\n## 1. ฟัง 3 ทาง\n\nก่อนแบ่ง charter เราฟังระบบจาก 3 มุม แล้วรวมเป็นรายการความเสี่ยง\n\n### 🗣️ ทางที่ 1 — ผู้ใช้ (`01_USER-STORIES.md`)\n\n| สิ่งที่ผู้ใช้คาดหวัง | ถ้าผิดแล้วเสียอะไร |\n|---|---|\n| \"% ที่เห็นคือโอกาสจริง\" | ทีมไม่เชื่อการสุ่ม เลิกใช้ |\n| \"ทุกคนในห้องเห็นผลเดียวกัน\" | เถียงกันเหมือนเดิม |\n| \"ร้านที่เพิ่งไปไม่โผล่ซ้ำ\" | เจอร้านเดิมทุกวัน |\n| \"ขี้เกียจเดิน ต้องได้ร้านใกล้จริง\" | เดินไกลกลางแดด |\n| \"ใครก็แก้ข้อมูลร้านได้\" | ข้อมูลเสียหาย หรือมีคนแกล้ง |\n\n### 📜 ทางที่ 2 — ข้อกำหนดและโค้ด (`02_REQUIREMENTS.md`, `src/`)\n\n| จุดที่โค้ดซับซ้อน | ทำไมเสี่ยง |\n|---|---|\n| ตัวคูณ 6 ตัวคูณกัน (`src/lib/odds.ts`) | client กับ server คิดแยกกัน ตัวเลขอาจไม่ตรงกัน |\n| เวลา \"กินไปแล้ว\" เทียบกับนาฬิกาเบราว์เซอร์ | BUG-01 เคยเกิดตรงนี้ |\n| เก็บข้อมูลเป็นไฟล์ JSON เขียนทับทั้งไฟล์ | หลายคนกดพร้อมกัน ข้อมูลอาจหาย |\n| SSE realtime ต่อค้างไว้ | หลุดแล้วต่อใหม่ ต้องได้ข้อมูลล่าสุด (BUG-02) |\n| ไม่มี login ทุก API เปิดหมด | ใครก็เรียก API แก้ร้าน ลบประเภทอาหารได้ |\n| README ไม่ได้เขียนตัวคูณคะแนนแมวไว้ในสูตร | เอกสารกับโค้ดไม่ตรงกัน |\n\n### 🐞 ทางที่ 3 — บั๊กที่เคยพบ (`e2e/defects.json`)\n\n| บั๊ก | บอกอะไรเรา |\n|---|---|\n| BUG-01 กินแล้วตัวคูณไม่ลด | ส่วนที่เกี่ยวกับ **เวลา** เปราะ |\n| BUG-02 เพิ่มร้านแล้วกระดานไม่อัปเดต | **cache และ realtime** เปราะ |\n| BUG-03/04/05 หมุดแผนที่ | **แผนที่** เปราะ ทั้งตำแหน่งและการกด |\n| BUG-06 แผงแก้ไขหายเมื่อร้านหลุด 15 อันดับ | **รายการที่เปลี่ยนลำดับระหว่างใช้งาน** เปราะ |\n\n## 2. Charter\n\n| ID | ชื่อ | เวลา | ผู้สำรวจ | เซิร์ฟเวอร์ | ไฟล์ผล |\n|---|---|---|---|---|---|\n| CH-01 | สูตรโอกาสและการสุ่ม | 45 นาที | agent A | `:3301` | `08_exploration/CH-01-odds.md` |\n| CH-02 | ห้องและ realtime | 45 นาที | agent B | `:3302` | `08_exploration/CH-02-rooms.md` |\n| CH-03 | ข้อมูลร้าน ประเภทอาหาร และ API | 45 นาที | agent C | `:3303` | `08_exploration/CH-03-data-api.md` |\n| CH-04 | หน้าจอ มือถือ แผนที่ ประวัติ | 45 นาที | agent D | `:3304` | `08_exploration/CH-04-ui.md` |\n\nทุกเซิร์ฟเวอร์รันจาก build เดียวกัน (`next start`) แต่ใช้โฟลเดอร์ข้อมูลของตัวเอง (`LUNCH_DATA_DIR`) และเปิด `LUNCH_TEST=1` จึงล้างข้อมูลได้ด้วย `POST /api/test/reset` โดยไม่ชนกัน และไม่แตะ `data/` จริง\n\n---\n\n### CH-01 · สูตรโอกาสและการสุ่ม\n\n**สำรวจ** โอกาสของแต่ละร้านและ `POST /api/draw`\n**ด้วย** การผสมตัวคูณหลายตัวพร้อมกัน (โหวตแนว + โหวตร้าน + กินแล้ว + ขี้เกียจเดิน + คะแนนแมว + น้ำหนัก) และการสุ่มซ้ำหลายร้อยครั้ง\n**เพื่อค้นหา** จุดที่ % บนจอไม่ตรงกับสูตร หรือผลสุ่มจริงไม่ตรงกับ % ที่แสดง\n\nแนวคิดที่ควรลอง\n- คิด % ด้วยมือ (หรือสคริปต์) จากสูตรใน `src/lib/odds.ts` แล้วเทียบกับจอ\n- โหวต − หลายครั้งจนชนพื้น ×0.1\n- น้ำหนักต่ำสุด 0.5 และสูงสุด 5 ร่วมกับตัวคูณอื่น\n- ร้านที่ไม่มี `walkDistance` (ใช้ระยะเส้นตรง × 1.3) ในโหมดขี้เกียจเดิน\n- สุ่ม 500–1,000 ครั้งผ่าน API แล้วดูว่าความถี่ใกล้ % หรือไม่\n- ส่ง `scores` / `picks` แปลก ๆ ให้ `/api/draw` (เช่น 99, −99, string, แนวที่ไม่มี)\n\n### CH-02 · ห้องและ realtime\n\n**สำรวจ** ห้อง (`/room/CODE`) และ `GET /api/events`\n**ด้วย** หลายเบราว์เซอร์ / หลาย request พร้อมกัน การตัดและต่อ SSE ใหม่\n**เพื่อค้นหา** จุดที่สมาชิกเห็นข้อมูลไม่ตรงกัน หรือข้อมูลหายเมื่อทำพร้อมกัน\n\nแนวคิดที่ควรลอง\n- 2–5 คนโหวตแนวเดียวกันพร้อมกัน (ยิง request ขนาน) แล้วดูว่าผลรวมถูกไหม\n- รหัสห้องตัวพิมพ์เล็ก / มีช่องว่าง\n- ชื่อเล่นว่าง ยาว 25+ ตัว อีโมจิ ช่องว่างล้วน ชื่อเดียวกันต่างตัวพิมพ์\n- สุ่มร้านในห้องพร้อมกันสองคน\n- ต่อ SSE แล้วดู event แรก / ตัดแล้วต่อใหม่\n- สมาชิกห้องหนึ่งโหวตในอีกห้อง\n\n### CH-03 · ข้อมูลร้าน ประเภทอาหาร และ API\n\n**สำรวจ** `PATCH/DELETE /api/restaurants/:id`, `POST /api/restaurants`, `/api/categories`, `PUT /api/restaurants/:id/rating`\n**ด้วย** ค่าขอบเขต ค่าผิดชนิด ข้อความยาว ตัวอักษรพิเศษ และลำดับการกระทำที่ไม่ปกติ\n**เพื่อค้นหา** ข้อมูลที่ระบบรับทั้งที่ไม่ควรรับ ข้อมูลเสียหลังลบ/แก้ และความเสี่ยงจากการไม่มี login\n\nแนวคิดที่ควรลอง\n- `baseWeight` 0.49 / 0.5 / 0.74 / 5 / 5.01 / \"2\" / null\n- ชื่อร้าน / ชื่อเล่น / ชื่อแนวที่มี `<script>`, HTML, อีโมจิ, 81 ตัวอักษร\n- เพิ่มร้านที่ระยะ 1,999 / 2,001 ม. พิกัดผิดรูปแบบ ลิงก์ Google Maps หลายแบบ\n- ลบประเภทอาหารที่เป็นแนวเดียวของร้าน แล้วร้านนั้นเป็นอย่างไร\n- แก้ชื่อแนวให้ซ้ำแนวอื่น · ลบแล้วเพิ่มชื่อเดิมกลับมา\n- ให้คะแนนด้วย `rater` สั้น/ยาว/ตัวอักษรไม่อนุญาต · score 0–5\n- เขียนพร้อมกันหลาย request แล้วดูว่าไฟล์ข้อมูลยังถูกต้อง\n\n### CH-04 · หน้าจอ มือถือ แผนที่ ประวัติ\n\n**สำรวจ** หน้า `/`, `/history`, `/restaurants/new`, `/categories`, มุมมองแผนที่\n**ด้วย** Playwright (Chromium) บนจอ 1440×1000 และ 390×844, คีย์บอร์ดอย่างเดียว, บล็อกอินเทอร์เน็ตภายนอก\n**เพื่อค้นหา** ปัญหาการใช้งาน การเข้าถึง (accessibility) ข้อความ และสถานะที่หน้าจอแสดงผิด\n\nแนวคิดที่ควรลอง\n- ใช้ Tab / Enter อย่างเดียวสุ่มร้านและโหวตได้ไหม · ปุ่มมีชื่อให้โปรแกรมอ่านจอไหม\n- จอมือถือ: ข้อความล้น ปุ่มเล็กเกินกด แผนที่ใช้ได้ไหม\n- กดสุ่มร้านรัว ๆ หลายครั้ง\n- ตัวกรองที่ไม่เหลือร้าน แล้วสลับไปแผนที่\n- ประวัติเมื่อร้านที่เคยสุ่มได้ถูกปิด / ถูกลบ\n- ตัวเลข % ที่ปัดเศษ เช่น `<0.1%` รวมกันได้ 100% หรือไม่\n\n---\n\n## 3. กติกาสำหรับผู้สำรวจทุกคน\n\n1. ใช้เฉพาะเซิร์ฟเวอร์ของตัวเอง ห้ามแตะพอร์ต 3100 (เซิร์ฟเวอร์ dev ของเจ้าของ) และห้ามแก้ไฟล์ใน `src/`, `data/`, `e2e/`\n2. เริ่มทุกการทดลองด้วย `POST /api/test/reset`\n3. จดทุกอย่างที่เจอ แม้ไม่แน่ใจว่าเป็นบั๊ก แยกเป็น **บั๊ก** / **คำถาม** / **ข้อสังเกต**\n4. ทุกข้อต้องมีขั้นตอนทำซ้ำ ผลที่ได้ และผลที่คาด (อ้าง story หรือโค้ดที่เกี่ยวข้อง)\n5. ใส่ระดับที่เสนอ (P1/P2/P3) ตามเกณฑ์ใน `10_TEST-PLAN.md` ผู้ตัดสินในขั้นที่ 9 จะยืนยันอีกครั้ง\n6. หมดเวลาแล้วหยุด เขียนสรุปว่าสำรวจอะไรไปแล้ว อะไรยังไม่ได้แตะ\n\n## 4. รูปแบบไฟล์ผล\n\n```markdown\n# CH-0X <ชื่อ charter>\nผู้สำรวจ · วันที่ · เวลาที่ใช้ · เซิร์ฟเวอร์\n\n## สิ่งที่ทำ (session log)\n## สิ่งที่พบ\n| ID | ประเภท | ระดับเสนอ | สรุป | ขั้นตอนทำซ้ำ | ผลที่ได้ | ผลที่คาด | หลักฐาน |\n## สิ่งที่ยังไม่ได้สำรวจ\n## ไอเดีย test case ใหม่\n```\n"}, {"key": "08a", "title": "CH-01 สูตรโอกาส", "file": "08_exploration/CH-01-odds.md", "phase": "สำรวจ", "md": "# CH-01 สูตรโอกาสและการสุ่ม\nผู้สำรวจ: agent A · วันที่ 2026-11-06 · เวลาที่ใช้ ~40 นาที · เซิร์ฟเวอร์ `http://localhost:3301` (production build, `LUNCH_TEST=1`, โฟลเดอร์ข้อมูลแยก)\n\n> สคริปต์ทั้งหมดอยู่นอกโปรเจกต์ (scratchpad `ch01/`) ใช้สูตรที่ **เขียนใหม่เอง** ตาม README / US §5 (ไม่ได้ import `src/lib/odds.ts`) เพื่อใช้เทียบกับ server และหน้าจอ\n> หมายเหตุสภาพแวดล้อม: ช่วง ~14:26–14:35 เจ้าของ build `.next` ใหม่ทับ ทำให้หน้าเว็บของ :3301 โหลด JS chunk ไม่ได้ (404, React #418) จึงยังไม่ hydrate หลัง coordinator รีสตาร์ตเซิร์ฟเวอร์ ผมรันการตรวจ UI ใหม่แล้วผ่าน **ไม่นับเรื่องนี้เป็นบั๊กของแอป**\n\n## สิ่งที่ทำ (session log)\n\n| # | การทดลอง | วิธี | ผล |\n|---|---|---|---|\n| E1 | น้ำหนักพื้นฐานที่พื้นและเพดาน + ร้านปิด | ร้าน #1–#4 ราคา ฿ น้ำหนัก 0.5/1/2/5 · #5 ราคา ฿ น้ำหนัก 5 แต่ **ปิด** · `POST /api/draw {prices:[1]}` × 900 (และ × 2000 ในรอบแรก) | ✅ คาด 5.88/11.76/23.53/58.82% · ได้ 62/104/238/496 จาก 900 ครั้ง (χ²=6.94, df=3, p≈0.07) · รอบ 2000 ครั้ง χ²=1.26 · `probability` ที่ server ตอบตรงสูตรทุกครั้ง (maxDiff=0) · ร้านปิดไม่ถูกสุ่มเลยสักครั้ง |\n| E2 | ใช้ตัวคูณหลายตัวพร้อมกัน | ขี้เกียจเดิน + ฿฿ · ร้าน #1(164ม., ×5, โหวตร้าน −1) #22(211ม., ×0.5, southern +1) #33(333ม., แมวเฉลี่ย 2.5, noodle −1) #5(439ม., แมว 4, โหวตร้าน +1) #84(499ม., กินวันนี้ ×0.2, western +1) + #14 (505ม.) ที่ต้องถูกกรองออก · สุ่ม 950 ครั้ง | ✅ คาด 51.12/14.41/14.47/16.32/3.68% · ได้ 486/134/142/157/31 (χ²=0.67, df=4) · `probability` ต่างจากสูตรไม่เกิน 3.6e-6 (เกิดจากตัวคูณกินแล้วขยับตามเวลา) · #14 ไม่โผล่ |\n| E2′ | รอบแรกของ E2 ที่สุ่ม 3,000 ครั้ง | เหมือน E2 | ❌ #84 ได้ 197 ครั้ง (คาด 53) → เจอ **F01-01** โทษ \"กินแล้ว\" หายหลังสุ่มครบ 1,000 ครั้ง |\n| E3 | ยืนยัน F01-01 | กินร้าน #84 → สุ่ม 999 ครั้ง → สุ่มเพิ่ม 1 ครั้ง | ยืนยันได้ (ดู F01-01) |\n| E4 | ห้องที่ตัวคูณชนพื้น ×0.1 | ห้อง ฿฿฿ มี 3 คน ทั้ง 3 คนโหวต −1 ทุกแนวของ #1 และโหวต −1 ที่ร้าน #1 · โหวต noodle +1 สา * |\n| F02-09 | บั๊ก | P3 | `/room/ZZZZ` (ห้องไม่มีอยู่) แสดงหน้า 404 แต่ HTTP status เป็น 200 | `curl -s -o z.html -w \"%{http_code}\" http://localhost:3302/room/ZZZZ` | `200` และใน HTML มี `NEXT_HTTP_ERROR_FALLBACK;404` / \"404: This page could not be found.\" (เพราะเรียก `notFound()` ใน `<Suspense>` หลัง stream เริ่มแล้ว) ส่วน `/api/rooms/ZZZZ` และหน้าที่ไม่มีอยู่จริงได้ 404 ✅ | US-14 \"หน้า 404\" ควรได้ status 404 ด้วย (มีผลกับ crawler, ตัวแสดงลิงก์ในแชต, monitoring) | ผล curl ตามช่องผลที่ได้ |\n| F02-10 | คำถาม | P3 | ไม่ต้องเป็นสมาชิกก็สุ่มในห้องได้ และใครพิมพ์ชื่อเล่นเดียวกันก็สวมเป็นคนนั้นได้ | `POST /api/draw {roomCode}` โดยไม่ join · join ด้วยชื่อที่คนอื่นใช้อยู่ | สุ่มได้ 201 · ได้ member id เดิม แก้โหวตแทนคนนั้นได้ | เป็นไปตามการออกแบบ (US-10 ไม่มี login, ชื่อเดิม = คนเดิม) แต่ควรยืนยันว่ายอมรับความเสี่ยงนี้ได้ หรืออย่างน้อยกำหนดให้การสุ่มต้องมี `memberId` | `T8 draw by anyone 201`, `T1b same-name ids unique: 1` |\n\n### สรุปจำนวน\n- บั๊ก 7 (P1 ×1, P2 ×3, P3 ×3) · คำถาม 2 (P3) · ข้อสังเกต 1 (P3)\n  - P1: F02-01 · P2: F02-02, F02-04, F02-08 · P3: F02-03, F02-05, F02-06, F02-07, F02-09, F02-10\n\n### สิ่งที่ตรวจแล้วว่าใช้ได้\n- เขียนพร้อมกัน (join 30 คน, โหวต 30 คน, โหวตสลับของคนเดียว) ไม่มีข้อมูลหาย เพราะ store แก้ในหน่วยความจำแบบ synchronous และเขียนไฟล์ตามคิว\n- ชื่อเดียวกันที่ join พร้อมกันได้ member เดียว\n- ไม่มีโหวตรั่วข้ามห้อง ทั้งทาง API (404) และ SSE (event ส่งเฉพาะห้อง)\n- รหัสห้องตัวเล็กใช้ได้ทุกที่ (API, draw, หน้า, SSE, localStorage key ใช้รหัสตัวใหญ่จาก server)\n- SSE ส่ง state ล่าสุดทุกครั้งที่ต่อใหม่ ห้องที่ไม่มีอยู่ได้ `room: null` และ client ข้ามไป\n\n## สิ่งที่ยังไม่ได้สำรวจ\n- **ทดสอบ UI หลายเบราว์เซอร์จริง** (Playwright) ไม่ได้ทำเพราะ `.next` ไม่ตรงกับเซิร์ฟเวอร์ :3302 ควรรีสตาร์ต :3302 แล้วรัน `ui.cjs` (S1 สุ่มชนกันพร้อมเน็ตช้า, S2 offline/online ของ EventSource, S3 โหวตหลังห้องหาย, S4 URL ตัวเล็กและชื่อซ้ำ 2 เครื่อง) เพื่อยืนยัน F02-01, F02-02, F02-08 บนจอ\n- EventSource ของเบราว์เซอร์ต่อใหม่เองหลังเซิร์ฟเวอร์รีสตาร์ต (ไม่ได้รีสตาร์ตเพราะไม่ใช่สิทธิ์ของเรา)\n- listener รั่วหลังผู้ใช้ปิดแท็บจำนวนมาก (`subscribe` / `cleanup`) วัดจากภายนอกไม่ได้\n- ห้องหมดอายุ 3 วัน (ต้องแก้เวลา) และผลต่อคนที่เปิดหน้าค้างไว้\n- ลบแนวอาหารระหว่างที่ห้องมีโหวต (`deleteCategory` ส่ง event ห้อง) ซึ่งทับกับ CH-03\n- กด \"กินแล้ว\" พร้อมกันหลายคน และ `setEaten` สลับกัน\n\n## ไอเดีย test case ใหม่\n1. **TC-ROOM-RACE-01** สุ่มพร้อมกันพร้อมเน็ตช้า: ใช้ Playwright `page.route('**/api/draw')` หน่วง response ของ A 1.5 วินาที ให้ B กดหลัง 0.4 วินาที แล้วตรวจว่า `data-number` ของ `winner` ตรงกันทั้ง 3 จอ และตรงกับ `latestDraw`\n2. **TC-ROOM-RACE-02** หน่วง response ของโหวต A ระหว่างที่ B โหวต แล้วตรวจว่า `vote-net` บนจอ A ตรงกับ `GET /api/rooms/:code`\n3. **TC-ROOM-SSE-01** `context.setOffline(true)` → B โหวต → `setOffline(false)` ภายใน 5 วินาทีจอ A ต้องเห็นโหวตของ B\n4. **TC-ROOM-NICK-01** ชื่อเล่น 23 ตัว + อีโมจิ / ZWSP / NFC กับ NFD ต้องไม่ได้ชื่อเสียหรือมองไม่เห็น\n5. **TC-API-VOTE-TYPE** `value` เป็น `null`, `\"\"`, `true`, `\"1\"`, `[1]` ต้องได้ 400\n6. **TC-ROOM-DEL-REST** ลบร้านที่มีโหวตในห้อง แล้วเพิ่มร้านใหม่ ร้านใหม่ต้องไม่ได้โหวตเดิม\n7. **TC-ROOM-404-STATUS** `/room/ZZZZ` ต้องได้ HTTP 404\n8. **TC-ROOM-GONE** โหวตหลังห้องถูกลบต้องเห็นข้อความแจ้งและโหวตบนจอย้อนกลับ\n"}, {"key": "08c", "title": "CH-03 ข้อมูลและ API", "file": "08_exploration/CH-03-data-api.md", "phase": "สำรวจ", "md": "# CH-03 ข้อมูลร้าน แนวอาหาร และ API\nผู้สำรวจ: agent C · วันที่ 2026-11-06 · เวลาที่ใช้ ~40 นาที · เซิร์ฟเวอร์ `http://localhost:3303` (`next start`, `LUNCH_TEST=1`, ข้อมูลแยกใน scratchpad `explore-data-3`)\n\nสคริปต์ทั้งหมดอยู่ใน scratchpad `ch03/` (`e1.mjs` … `e10.mjs`, `parse.mts`) ทุกสคริปต์เริ่มด้วย `POST /api/test/reset`\n\n## สิ่งที่ทำ (session log)\n\n| เวลา | ทำอะไร | สคริปต์ |\n|---|---|---|\n| 0–5 | อ่าน charter, US-15–18, README, โค้ด `api/restaurants/**`, `api/categories/**`, `store.ts`, `server.ts`, `geo.ts`, ฟอร์มเพิ่มร้าน, หน้าจัดการแนว | – |\n| 5–10 | `PATCH /api/restaurants/:id` ค่าขอบเขต baseWeight, priceLevel, disab api/test/reset`** ตอบ 404 เมื่อไม่ได้เปิด `LUNCH_TEST=1` (ดูจากโค้ด)\n\n## สิ่งที่ยังไม่ได้สำรวจ\n\n- **UI จริง** ของช่องวางลิงก์, แผงแก้ไขร้านที่ `categories: []`, และการแสดงอีโมจิที่ถูกตัดครึ่ง: ทำไม่ได้เพราะ `.next` ถูก build ใหม่ระหว่างที่เซิร์ฟเวอร์รัน (chunk 404) ควรตรวจซ้ำหลังรีสตาร์ต :3303\n- ไฟล์ JSON เสีย/ถูกแก้จากภายนอก: จากโค้ด ถ้า `restaurants.json` parse ไม่ได้ตอนเริ่ม จะได้ `[]` และการเขียนครั้งถัดไปจะ**ทับไฟล์ด้วยรายการว่าง** (ตรวจจากโค้ดเท่านั้น ไม่ได้ทดลองเพราะห้ามแก้ไฟล์ข้อมูล) ควรมีคนทดสอบในโฟลเดอร์ทิ้งได้\n- `walkingDistance` จริง (ข้ามในโหมด `LUNCH_TEST`) และการเพิ่มร้านพร้อมกันขณะรอบริการเส้นทาง 4 วินาที\n- ผลของ F03-01 ต่อหน้าแชมป์ 7 วัน และ SSE event ที่ส่งไปให้ห้องอื่นเมื่อลบแนว (CH-02)\n- ขนาด payload: label 5 MB ถูกปฏิเสธ 400 แต่ไม่ได้ลองชื่อร้าน/ร้านจำนวนมาก (สแปมร้านหลักพัน)\n\n## ไอเดีย test case ใหม่\n\n1. **TC-ADD-xx** ลบร้านที่เพิ่มเองเลขสูงสุด แล้วเพิ่มร้านใหม่ → เลขต้องไม่ซ้ำ และร้านใหม่ต้องไม่มีคะแนน/ประวัติ/โหวตติดมา (F03-01)\n2. **TC-CAT-xx** ลบแนวที่เป็นแนวเดียวของร้าน → ต้องถูกบล็อกหรือเตือน และร้านต้องไม่เหลือ `categories: []` (F03-02)\n3. **TC-CAT-xx** ลบแนวแล้วเพิ่มชื่อเดิม → ระบุพฤติกรรมที่ตั้งใจ (F03-03)\n4. **TC-API-xx** ค่าผิดชนิดใน `baseWeight`, `score`, id ใน path (`true`, `null`, `\"0x2\"`, `[2]`, `0x10`) → 400 (F03-06, F03-07, F03-08)\n5. **TC-ADD-xx** ชื่อร้าน 81 ตัวที่ลงท้ายด้วยอีโมจิ → ไม่มี `\\ud83d` ค้าง (F03-10)\n6. **Unit test `parseLatLon`**: ลิงก์ `/maps/dir/`, `?daddr=`, DMS, ข้อความที่มี `%` → ไม่โยน error และได้ปลายทาง (F03-13, F03-14, F03-15)\n7. **TC-API-xx** POST ด้วย `Content-Type: text/plain` → 415/400 (F03-16)\n8. **TC-API-xx** concurrent writes 200+ request แล้วเทียบไฟล์กับ API (ผ่านแล้ว ควรเก็บเป็น regression)\n"}, {"key": "08d", "title": "CH-04 หน้าจอ", "file": "08_exploration/CH-04-ui.md", "phase": "สำรวจ", "md": "# CH-04 หน้าจอ มือถือ แผนที่ ประวัติ\nagent D · 2026-11-06 · ประมาณ 45 นาที (รวมราว 8 นาทีที่เสียไปเพราะ build ถูกสร้างใหม่ ดูหมายเหตุ) · `http://localhost:3304` (`next start`, `LUNC nk โหลดไม่ได้ แต่ในเครื่องปกติช่วงนี้แค่ไม่กี่ร้อย ms) | เปิด `/` แล้วคลิก \"แสดงทั้งหมด\" ทันที | การคลิกหายไปเฉย ๆ ไม่มี error | ข้อนี้สำคัญน้อย จดไว้สำหรับคนเขียน test e2e: ต้องรอ hydrate ก่อนคลิก (`fixtures.ts` รอแค่ `pool-count` ซึ่ง SSR แสดงมาแล้ว) | สังเกตระหว่างช่วงที่ build เปลี่ยน และยืนยันว่าหลัง hydrate ทำงานปกติ |\n\n### สิ่งที่ตรวจแล้วทำงานถูกต้อง\n- **ลำดับ Tab สมเหตุสมผล:** โลโก้ → เมนู 3 ลิงก์ → สวิตช์ขี้เกียจเดิน → ราคา 5 ปุ่ม → **สุ่มร้าน (Tab ครั้งที่ 11)** → สร้างห้อง → จัดการประเภทอาหาร → โหวตแนว (Tab ครั้งที่ 14–45) → รายการ/แผนที่ → แถวกระดาน ทุก element มีกรอบ focus `outline 2px` สวิตช์เป็น `<input role=switch>` ที่ซ่อนไว้ (1×1 px) และกรอบ focus แสดงบนตัวสวิตช์ผ่าน `peer-focus-visible`\n- Enter สุ่มได้ (`winner via Enter: 199`) Space เปิดขี้เกียจเดินได้ (237→49) Enter โหวตแนวได้ (\"โหวตแล้ว 1 แนว\") และ Enter ที่หมุดเลือกร้านในแผงได้\n- **ปุ่มไอคอนทุกปุ่มมีชื่อ:** − / + มี `aria-label` เช่น \"ไม่อยากกินข้าวแกง\" และ \"อยากไปร้าน ครัวอร๊อย-อร่อย\" ปุ่มคะแนนแมวมี \"ให้คะแนน อร่อยมาก\" ปุ่มปิดแผงแผนที่มี \"ปิด\" ปุ่มน้ำหนัก ± มี `aria-label` หมุดมีชื่อร้านพร้อม % และสถานะกดใช้ `aria-pressed` / `aria-checked` / `aria-expanded` ถูกต้อง\n- มือถือ: ปุ่ม \"สุ่มร้าน\" อยู่ที่ y=393 (เห็นโดยไม่ต้องเลื่อน) หลังแตะสุ่ม หน้าเลื่อนไปที่การ์ดผล (`winner top y=10`) ตาม US-20 · `/history`, `/restaurants/new`, `/categories` และมุมมองรายการไม่มี scroll แนวนอน ข้อความไทยยาวถูกตัดด้วย `truncate` ไม่ล้นจอ\n- ตัวกรองไม่เหลือร้าน: ปุ่มถูก disable กระดานแสดง \"ไม่มีร้านที่ตรงกับตัวกรองนี้\" แผนที่ 0 หมุดโดยไม่ error และหมุดกลับมาเมื่อล้างตัวกรอง\n- บล็อกเน็ตภายนอกแล้วหมุดยังขึ้นครบ (237 / 49) สุ่มบนแผนที่แล้วหมุดของผู้ชนะได้ `data-tone=lit`\n- console: หลัง build ใหม่**ไม่มี error จากแอป** มีแค่ `AJAXError … cartocdn style.json` / `net::ERR_FAILED` (เกิดจากการบล็อกเน็ตตามที่ตั้งใจ) และ warning ของ WebGL driver\n\n## สิ่งที่ยังไม่ได้สำรวจ\n- โปรแกรมอ่านจอจริง (NVDA / VoiceOver) ทดสอบแค่ชื่อที่ได้จาก DOM\n- ห้อง (`/room/CODE`) บนมือถือ และหน้า JoinRoom ด้วยคีย์บอร์ด\n- ฟอร์ม `/restaurants/new` ด้วยคีย์บอร์ด (ปักหมุดด้วยคีย์บอร์ดทำได้ไหม) และข้อความ error ของฟอร์ม\n- ทำให้เกิดแถว `<0.1%` บนจอแล้วดูผลรวม (ต้องใช้ตัวคูณหลายตัวพร้อมกัน ซึ่งอยู่ในขอบเขต CH-01)\n- dark/light, ซูม 200%, `prefers-reduced-motion` (แอนิเมชันสุ่มไม่สนใจค่านี้ แต่ยังไม่ได้ตรวจ)\n- แผนที่บนมือถือ: pinch-zoom และการแตะหมุดที่ซ้อนกัน (\"ร้านในจุดเดียวกัน\")\n\n## ไอเดีย test case ใหม่\n- **TC-DRAW-xx** กด Enter หรือดับเบิลคลิก \"สุ่มร้าน\" แล้ว `POST /api/draw` ต้องถูกเรียก 1 ครั้ง และ `/history` ต้องเพิ่ม 1 แถว (F04-01)\n- **TC-MOB-xx** 390×844 สลับเป็นแผนที่แล้ว `scrollWidth <= clientWidth` (F04-02 ตอนนี้ TC-MOB ตรวจแค่มุมมองรายการ)\n- **TC-HIST-xx** ลบร้านเพิ่มเองแล้วเพิ่มร้านใหม่ ประวัติเดิมต้องไม่เปลี่ยนชื่อ และร้านใหม่ต้องไม่มีป้ายกินแล้วหรือคะแนน (F04-03 / F03-01)\n- **TC-A11Y-01** หลังสุ่มด้วยคีย์บอร์ด `document.activeElement` ต้องไม่เป็น `BODY` (F04-04)\n- **TC-A11Y-02** ทุก `button` ที่มองเห็นต้องมีชื่อ (text หรือ `aria-label`) ตอนนี้ผ่าน ใช้กันถอยหลัง\n- **TC-MAP-xx** ตัวกรองไม่เหลือร้านแล้วสลับเป็นแผนที่ ต้องมีข้อความบอกและ 0 หมุด จากนั้นล้างตัวกรองแล้วหมุดต้องกลับมา\n\n\n## ภาพประกอบ\n\n**img/CH04-mobile-map-overflow.png**\n\n![img/CH04-mobile-map-overflow.png](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAYYAAANMCAIAAADXDp1JAAAQAElEQVR4nOz9B3wc9Z3/j39W2yStum1JLmqWe5ONeyOmOD4CxhiOAAd3+SZAyoW7b8g3l7uEe/yBe1zCXS7/C0dIheSSAAEMphlijCnG2OBeZVvuRZa7rd52V9LvtfvRDuNtWq22zM68no+1PDv7mdnZKa95l8+8P5ahQ4eLqEhPty9ZcvPHH3/Y0NCgzJw0aXJBweD16z8Ks+CyZbeXlJTW1p56883X5Jy8vLybbrpl9eq3saprr72usLDQarUOGjS4vb1t5coV6vUTQ2GzWXn0A8H14nS6RKzJz8+7cOGCSDYW0X+wR+6448sZGZmYvu++/yOFY8qUaVOmVMkGmNizZ3d4Yaqvrw/1EcToww/XzpgxKzMzUxAD09PTY7FY3G63ID6wQ7BbhH4xRW0lERJvzGaz09kJBPGRnp5utdq6urpErNGIlZQmCNEq3d1ddrtNEBVwZrFbhH6hJBHtAgcFL4fDIYiXrKwsuU90DCWJaJqurm5ET3ApCsODnQBPFjtE6JpowtuEJBKXy41LMScnx+l0ur0II2HxYrPZYBxhVwi9Q0kiKQCiuSaTCZel3W43eRHGoMcHjCN9J9oUKEkkNcAF6XbrOaxLJIwlEUI0BCWJEKIhKEmEEA1BSSKEaAhKEiFEQ1CSCCEagpJECNEQlCRCiIagJBFCNAR7b5PUwGQymc1pJh/CGPCBEkK0iNlshgoZ+bFbu93e3d0Tj8ptWoO ิน)", "file": "09_EXPLORATION.md", "phase": "สำรวจ", "md": "# ⚖️ ผลตัดสินการสำรวจ — ข้าวไหนดี (lunch-draw)\n\nผู้ตัดสินแยก (ไม่ได้เขียนข้อพบเอง) · 2026-11-06 · ใช้เวลาประมาณ 45 นาที · เซิร์ฟเวอร์ `:3301`–`:3304` (production build, `LUNCH_TEST=1`, ข้อมูลแยก) · `POST /api/test/reset` ก่อนทำซ้ำทุกครั้ง\nอินพุต: `08_exploration/CH-01…CH-04` (48 ข้อ) · เทียบกับ `01_USER-STORIES.md`, `02_REQUIREMENTS.md` (FR/BR/NFR) และโค้ดใน `src/` (เลขบรรทัดอ้างจากไฟล์ปัจจุบัน ซึ่งเจ้าของอาจกำลังแก้อยู่)\nสคริปต์ของผู้ตัดสินอยู่นอกโปรเจกต์ใน `…/scratchpad/judge/` ได้แก่ `api.mjs` (โหมด `reuse` / `cat` / `types` / `draw` / `room`), `cap.mjs`, `room-race.cjs` (`race` / `race nodelay` / `vote` / `gone`), `ui.cjs` (`rapid` / `clamp` / `empty`), `mapmobile*.cjs`, `s5/s5.js` (สคริปต์ของ CH-04 ที่รันใหม่) และ `parse.mts` ทุกข้อ P1/P2 และทุกบั๊กผมรันใหม่เองหมด ไม่ได้เชื่อผลที่ผู้สำรวจจดไว้ ส่วนข้อสังเกตระดับ P3 บางข้อตรวจจากโค้ดหรือภาพหน้าจอ และระบุไว้ในตาราง\nหมายเหตุ: การเปลี่ยนคำบนหน้าจอ (\"จับสลาก\" เป็น \"สุ่มร้าน\", \"แนวอาหาร\" เป็น \"ประเภทอาหาร\", \"น้ำหนักพื้นฐาน\" เป็น \"ตัวคูณโอกาส\", \"ร้านที่ปิดไว้\" เป็น \"ร้านที่ไม่สุ่ม\") เป็นการเปลี่ยนที่ตั้งใจ ไม่นับเป็นบั๊ก\n\n---\n\n## 1. สรุป\n\nผู้สำรวจ 4 คนส่งข้อพบมา 48 ข้อ ผมทำซ้ำแล้ว **ยืนยันได้ 28 ข้อ (master)** **ซ้ำ 13 ข้อ** (รวมเข้า master แล้ว) **ไม่ยืนยัน 2 ข้อ** และ **เป็นคำถามถึงทีม 5 ข้อ** มี **P1 สองข้อ** ซึ่งตรงกับความกลัวหลักของทีมทั้งสองเรื่อง\n**(1) สมาชิกในห้องเห็นผลสุ่มคนละร้าน** เมื่อ 2 คนกด \"สุ่มร้าน\" พร้อมกัน ผมทำซ้ำได้ **3/3 รอบในเบราว์เซอร์จริงโดยไม่ต้องหน่วงเน็ต** ข้อนี้หนักกว่าที่ CH-02 รายงาน เพราะ CH-02 ใช้สคริปต์จำลอง client และสรุปว่า \"จอสุดท้ายตรงกันทุกรอบ\" (F02-03) ซึ่งไม่จริงในเบราว์เซอร์\n**(2) เลขร้านถูกใช้ซ้ำหลังลบร้านที่เพิ่มเอง** ร้านใหม่ได้คะแนนแมว โทษ \"กินแล้ว\" และโหวตในห้องของร้านเก่าไปด้วย และหน้าประวัติเปลี่ยนชื่อร้านย้อนหลัง\nP2 มี 5 ข้อ ได้แก่ กดสุ่มรัวแล้วได้หลาย draw, โทษกินแล้วหายเมื่อสุ่มครบ 1,000 ครั้ง, ลบประเภทอาหารแล้วร้านไม่เหลือประเภท, response โหวตที่มาช้าทับข้อมูลห้อง และโหวตที่ล้มเหลวแต่จอแสดงว่าสำเร็จ\nผมลดระดับ 3 ข้อจาก P2 เป็น P3: F04-02 (เกิดเฉพาะเมื่อร้านอันดับต้นมีชื่อไทยยาวไม่มีช่องว่าง ข้อมูลตั้งต้นไม่เกิด), F03-13 (ลิงก์เส้นทางพบไม่บ่อย และหมุดตัวอย่างบนฟอร์มแสดงตำแหน่งให้เห็น) และ F03-03 (ส่วนที่เป็นบั๊กเกิดเฉพาะเมื่อลบครบทุกประเภท ส่วนเรื่อง undo ย้ายไปเป็นคำถาม)\n\n### ตารางนับ: ก่อน → หลังตัดสิน\n\n| ระดับที่ผู้สำรวจเสนอ | พบ | ✅ ยืนยัน | 🔁 ซ้ำ | ❌ ไม่ยืนยัน | ❓ คำถาม |\n|---|---|---|---|---|---|\n| P1 | 3 | 2 | 1 | 0 | 0 |\n| P2 | 10 | 8 | 1 | 0 | 1 |\n| P3 | 35 | 18 | 11 | 2 | 4 |\n| **รวม** | **48** | **28** | **13** | **2** | **5** |\n\n| ระดับสุดท้ายของข้อที่ยืนยัน (master) | จำนวน | ID |\n|---|---|---|\n| **P1** | **2** | EXP-01, EXP-02 |\n| **P2** | **5** | EXP-03 – EXP-07 |\n| **P3** | **21** | EXP-08 – EXP-28 |\n\nระดับที่เปลี่ยน: ลดจาก P2 เป็น P3 สามข้อ (F03-03, F03-13, F04-02) · F03-04 ที่เสนอเป็น P2 ย้ายไปเป็นคำถาม · ไม่มีข้อไหนเพิ่มระดับ แต่ F02-01 มีหลักฐานแรงขึ้น (เกิดได้โดยไม่ต้องหน่วงเน็ต)\n\n---\n\n## 2. ตารางผลตัดสินทุกข้อ\n\nสคริปต์ในคอลัมน์หลักฐานทั้งหมดอยู่ใน `judge/`\n\n### CH-01 สูตรโอกาสและการสุ่ม\n\n| ID เดิม | สรุป | เสนอ | คำตัดสิน | สุดท้าย | หลักฐานที่ผู้ตัดสินทำซ้ำ | ละเมิด |\n|---|---|---|---|---|---|---|\n| F01-01 | โทษ \"กินแล้ว\" หายเมื่อสุ่มเพิ่มครบ 1,000 ครั้ง | P2 | ✅ → **EXP-04** | P2 | `node cap.mjs` → `after +999 draws lastEatenAt 2026-11-06T07:45:53Z` / `after +1000 draws lastEatenAt null` ใช้เวลาแค่ 3.7 วินาที ไม่มี login ก็ทำได้ จึงยังเป็น P2 (ใช้งานปกติไม่ถึง 1,000 ครั้งใน 7 วัน) | US-07, BR-06, BR-25 (ขัดกับ BR-24) |\n| F01-02 | `lazy:\"false\"` เปิดขี้เกียจเดิน | P3 | 🔁 → F01-04 | P3 | `node api.mjs draw` → `lazy \"false\" 201 p 0.4982` (เท่ากับ `lazy true`) | NFR-09 |\n| F01-03 | scores 0.5 / true / \"1\" / [1] ถูกรับ | P3 | 🔁 → F01-04 | P3 | `score 0.5 p(#1) 0.5556`, `true/\"1\"/[1] → 0.6000` | BR-23, NFR-09 |\n| F01-04 | body ขยะหรือ prices ผิดรูป ได้ 201 และถูกบันทึกลงประวัติ | P3 | ✅ → **EXP-12** | P3 | `draw garbage body 201 {id…}` · `prices [9] 201 p 0.00422` (=1/237) | N
