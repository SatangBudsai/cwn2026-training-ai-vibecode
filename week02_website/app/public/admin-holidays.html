<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>วันหยุด - e-Service กลาง</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<a class="skip" href="#main">ข้ามไปที่เนื้อหาหลัก</a>
<div id="hdr"></div>
<main id="main" class="container" tabindex="-1">
  <h1>จัดการวันหยุด</h1>
  <div id="msgs"></div>
  <div class="card">
    <div class="grid cols3">
      <div class="field"><label for="date">วันที่ (YYYY-MM-DD ค.ศ.)</label><input type="text" id="date" placeholder="2026-12-02" data-testid="holiday-date-input"></div>
      <div class="field"><label for="name">ชื่อวันหยุด</label><input type="text" id="name" data-testid="holiday-name-input"></div>
    </div>
    <button type="button" class="btn" id="add" data-testid="holiday-add-btn">เพิ่มวันหยุด</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th scope="col">วันที่</th><th scope="col">ชื่อ</th><th scope="col">ลบ</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
<script type="module" src="/static/admin-holidays.js"></script>
</body>
</html>
