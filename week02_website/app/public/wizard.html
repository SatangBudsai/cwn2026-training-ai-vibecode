<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ยื่นคำขอบริการ - e-Service กลาง</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<a class="skip" href="#main">ข้ามไปที่เนื้อหาหลัก</a>
<div id="hdr"></div>
<main id="main" class="container" tabindex="-1">
  <h1 data-testid="service-name"></h1>
  <p class="note"><span class="lbl">ขั้นตอน:</span> <strong data-testid="wizard-step" aria-live="polite">1/3 กรอกข้อมูล</strong></p>
  <div id="msgs"></div>

  <section id="s1" class="card accent" aria-labelledby="h1s">
    <h2 id="h1s">กรอกข้อมูล</h2>
    <div class="field" id="qty-field" hidden>
      <label for="qty">จำนวนฉบับ (1–5)</label>
      <input type="text" id="qty" inputmode="numeric" value="1" data-testid="qty-input" autocomplete="off">
    </div>
    <div class="field" id="area-field" hidden>
      <label for="area">พื้นที่อาคาร (ตร.ม.)</label>
      <input type="text" id="area" inputmode="numeric" data-testid="area-input" autocomplete="off">
    </div>
    <p>ค่าธรรมเนียม: <strong class="kpi" data-testid="fee-total" aria-live="polite">–</strong></p>
    <div id="fee-slot" aria-live="polite"></div>
    <p id="draft-slot"></p>
    <div class="btn-row">
      <button type="button" class="btn secondary" id="save-draft" data-testid="save-draft-btn">บันทึกร่าง</button>
      <button type="button" class="btn" id="to-upload" data-testid="to-upload-btn" disabled>ไปขั้นแนบเอกสาร</button>
    </div>
  </section>

  <section id="s2" class="card accent" aria-labelledby="h2s" hidden>
    <h2 id="h2s">แนบเอกสาร</h2>
    <p class="note">รองรับไฟล์ PDF, JPG, PNG ขนาดไม่เกิน 5 MB (✱ = จำเป็น)</p>
    <div id="uploads"></div>
    <div id="upload-slot" aria-live="polite"></div>
    <h3>ไฟล์ที่แนบแล้ว</h3>
    <ul class="plain" id="files"></ul>
    <div id="missing-slot" aria-live="polite"></div>
    <div class="btn-row">
      <button type="button" class="btn secondary" id="back1">ย้อนกลับ</button>
      <button type="button" class="btn" id="to-payment" data-testid="to-payment-btn" disabled>ไปชำระเงิน</button>
    </div>
  </section>

  <section id="s3" class="card accent" aria-labelledby="h3s" hidden>
    <h2 id="h3s">ชำระเงิน</h2>
    <p>ยอดที่ต้องชำระ: <strong class="kpi" data-testid="payment-amount">–</strong></p>
    <div id="pay"></div>
    <div class="btn-row" id="pay-actions">
      <button type="button" class="btn secondary" id="back2">ย้อนกลับ</button>
      <button type="button" class="btn" id="create-qr" data-testid="create-qr-btn">สร้าง QR</button>
    </div>
  </section>
</main>
<script type="module" src="/static/wizard.js"></script>
</body>
</html>
