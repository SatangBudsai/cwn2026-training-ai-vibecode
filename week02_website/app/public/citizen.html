<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>คำขอของฉัน - e-Service กลาง</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<a class="skip" href="#main">ข้ามไปที่เนื้อหาหลัก</a>
<div id="hdr"></div>
<main id="main" class="container" tabindex="-1">
  <h1 data-testid="citizen-welcome">สวัสดี</h1>
  <div id="msgs"></div>
  <section class="card accent" aria-labelledby="h-start">
    <h2 id="h-start">เริ่มยื่นบริการ</h2>
    <div class="btn-row">
      <a class="btn" href="/citizen/new/SV-01" data-testid="start-service-SV-01">SV-01 ขอหนังสือรับรอง</a>
      <a class="btn" href="/citizen/new/SV-02" data-testid="start-service-SV-02">SV-02 ขออนุญาตประกอบกิจการ</a>
      <a class="btn" href="/citizen/new/SV-03" data-testid="start-service-SV-03">SV-03 ขออนุญาตก่อสร้าง/ต่อเติมอาคาร</a>
    </div>
  </section>
  <section aria-labelledby="h-drafts" class="card">
    <h2 id="h-drafts">ร่างและรอชำระเงิน</h2>
    <div class="table-wrap"><table>
      <thead><tr><th scope="col">รหัสร่าง</th><th scope="col">บริการ</th><th scope="col">สถานะ</th><th scope="col">การดำเนินการ</th></tr></thead>
      <tbody id="drafts"></tbody>
    </table></div>
    <p id="drafts-empty" class="note" hidden>ไม่มีร่าง</p>
  </section>
  <section aria-labelledby="h-cases" class="card">
    <h2 id="h-cases">คำขอของฉัน</h2>
    <div class="table-wrap"><table>
      <thead><tr><th scope="col">เลขคำขอ</th><th scope="col">บริการ</th><th scope="col">สถานะ</th><th scope="col">กำหนดเสร็จ</th></tr></thead>
      <tbody id="cases"></tbody>
    </table></div>
    <p id="cases-empty" class="note" hidden>ยังไม่มีคำขอ</p>
  </section>
</main>
<script type="module" src="/static/citizen.js"></script>
</body>
</html>
