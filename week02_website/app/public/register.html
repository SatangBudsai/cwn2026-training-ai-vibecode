<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ลงทะเบียน - e-Service กลาง</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<a class="skip" href="#main">ข้ามไปที่เนื้อหาหลัก</a>
<div id="hdr"></div>
<main id="main" class="container narrow" tabindex="-1">
  <h1>ลงทะเบียนใช้งาน</h1>
  <div id="msgs"></div>
  <div class="card accent">
    <div class="field">
      <label for="name">ชื่อ-สกุล (จาก ThaiD)</label>
      <input type="text" id="name" readonly data-testid="reg-name">
    </div>
    <div class="field">
      <label for="mobile">เบอร์มือถือ (บังคับ)</label>
      <input type="tel" id="mobile" inputmode="numeric" autocomplete="tel" data-testid="reg-mobile">
      <div id="mobile-slot" aria-live="polite"></div>
    </div>
    <div class="field">
      <label for="email">อีเมล (ไม่บังคับ)</label>
      <input type="email" id="email" autocomplete="email" data-testid="reg-email">
    </div>
    <div class="field">
      <label for="consent"><input type="checkbox" id="consent" data-testid="reg-consent"> ข้าพเจ้ายินยอมให้ประมวลผลข้อมูลส่วนบุคคล (PDPA)</label>
      <div id="consent-slot" aria-live="polite"></div>
    </div>
    <button type="button" class="btn" id="submit" data-testid="reg-submit">ลงทะเบียน</button>
  </div>
</main>
<script type="module" src="/static/register.js"></script>
</body>
</html>
